        <style>
            /* 项目详情页面特定样式 */
            .project-detail-container {
                max-width: 1200px;
                margin: 20px auto;
                padding: 0 20px;
            }

            .project-header {
                background: rgba(8, 12, 24, 0.78);
                border: 1px solid rgba(0, 240, 255, 0.16);
                box-shadow:
                    0 10px 28px rgba(0, 0, 0, 0.32),
                    0 0 20px rgba(0, 240, 255, 0.07);
                padding: 20px;
                border-radius: 8px;
                margin-bottom: 20px;
                position: relative;
                overflow: hidden;
            }

            .project-header h2 {
                margin: 0 0 10px 0;
                display: flex;
                align-items: center;
                gap: 10px;
            }

            .project-info {
                display: flex;
                flex-wrap: wrap;
                gap: 20px;
                margin-bottom: 15px;
            }

            .project-actions {
                display: flex;
                gap: 10px;
                margin-top: 15px;
            }

            .asset-upload-section {
                background: rgba(8, 12, 24, 0.78);
                border: 1px solid rgba(0, 240, 255, 0.16);
                box-shadow:
                    0 10px 28px rgba(0, 0, 0, 0.32),
                    0 0 20px rgba(0, 240, 255, 0.07);
                padding: 20px;
                border-radius: 8px;
                margin-bottom: 20px;
                position: relative;
                overflow: hidden;
            }

            .project-header::before,
            .asset-upload-section::before {
                content: '';
                position: absolute;
                top: -120%;
                left: -20%;
                width: 55%;
                height: 280%;
                background: linear-gradient(120deg, transparent, rgba(0, 240, 255, 0.15), transparent);
                transform: rotate(10deg);
                animation: detailFlowSweep 2.8s ease-in-out infinite;
                pointer-events: none;
            }

            .project-header::after,
            .asset-upload-section::after {
                content: '';
                position: absolute;
                inset: 0;
                border-radius: inherit;
                background: radial-gradient(
                    320px circle at var(--card-x, 50%) var(--card-y, 50%),
                    rgba(0, 240, 255, 0.2),
                    rgba(139, 92, 246, 0.08) 40%,
                    transparent 70%
                );
                pointer-events: none;
                opacity: 0.85;
            }

            .project-header > *,
            .asset-upload-section > * {
                position: relative;
                z-index: 1;
            }

            @keyframes detailFlowSweep {
                0%,
                68% {
                    transform: translateX(-120%) rotate(10deg);
                    opacity: 0;
                }
                82% {
                    opacity: 0.72;
                }
                100% {
                    transform: translateX(260%) rotate(10deg);
                    opacity: 0;
                }
            }

            .upload-tabs {
                display: flex;
                border-bottom: 1px solid rgba(0, 240, 255, 0.2);
                margin-bottom: 20px;
            }

            .upload-tab {
                padding: 10px 20px;
                cursor: pointer;
                border: none;
                background: none;
                color: #9aa8c4;
                border-bottom: 2px solid transparent;
                transition: all 0.3s ease;
            }

            .upload-tab.active {
                color: #00f0ff;
                border-bottom-color: #00f0ff;
                text-shadow: 0 0 12px rgba(0, 240, 255, 0.35);
            }

            .upload-content {
                display: none;
            }

            .upload-content.active {
                display: block;
            }

            .asset-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: 20px;
            }

            .asset-card {
                background: rgba(8, 12, 24, 0.82);
                border: 1px solid rgba(0, 240, 255, 0.14);
                border-radius: 8px;
                overflow: hidden;
                transition:
                    transform 0.3s ease,
                    box-shadow 0.3s ease;
                position: relative;
                --card-x: 50%;
                --card-y: 50%;
            }

            .asset-card::before {
                content: '';
                position: absolute;
                inset: 0;
                background: radial-gradient(
                    260px circle at var(--card-x) var(--card-y),
                    rgba(0, 240, 255, 0.24),
                    rgba(139, 92, 246, 0.1) 42%,
                    transparent 72%
                );
                opacity: 0;
                transition: opacity 0.16s ease;
                pointer-events: none;
                z-index: 0;
            }

            .asset-card > * {
                position: relative;
                z-index: 1;
            }

            .asset-card:hover {
                transform: translateY(-6px);
                box-shadow:
                    0 14px 30px rgba(0, 0, 0, 0.38),
                    0 0 24px rgba(0, 240, 255, 0.18);
                border-color: rgba(0, 240, 255, 0.35);
            }

            .asset-card:hover::before {
                opacity: 1;
            }

            .asset-preview {
                width: 100%;
                height: 200px;
                overflow: hidden;
                background-color: #0b1220;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .asset-preview img {
                max-width: 100%;
                max-height: 100%;
                object-fit: contain;
            }

            .asset-info {
                padding: 15px;
            }

            .asset-actions {
                display: flex;
                gap: 10px;
                margin-top: 10px;
            }

            /* 素材库预览：主题化卡片与操作按钮 */
            .asset-library-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
                gap: 16px;
            }

            .asset-library-item {
                background: linear-gradient(165deg, rgba(8, 13, 26, 0.88), rgba(8, 16, 32, 0.74));
                border: 1px solid rgba(0, 240, 255, 0.16);
                border-radius: 10px;
                overflow: hidden;
                box-shadow:
                    inset 0 0 0 1px rgba(0, 240, 255, 0.05),
                    0 10px 24px rgba(0, 0, 0, 0.28);
                transition:
                    transform 0.25s ease,
                    border-color 0.25s ease,
                    box-shadow 0.25s ease;
                position: relative;
                --card-x: 50%;
                --card-y: 50%;
            }

            .asset-library-item::after {
                content: '';
                position: absolute;
                inset: 0;
                background: radial-gradient(
                    260px circle at var(--card-x) var(--card-y),
                    rgba(0, 240, 255, 0.2),
                    rgba(139, 92, 246, 0.08) 42%,
                    transparent 72%
                );
                opacity: 0;
                transition: opacity 0.16s ease;
                pointer-events: none;
                z-index: 0;
            }

            .asset-library-item > * {
                position: relative;
                z-index: 1;
            }

            .asset-library-item:hover {
                transform: translateY(-5px);
                border-color: rgba(0, 240, 255, 0.34);
                box-shadow:
                    inset 0 0 0 1px rgba(0, 240, 255, 0.12),
                    0 16px 30px rgba(0, 0, 0, 0.34),
                    0 0 22px rgba(0, 240, 255, 0.18);
            }

            .asset-library-item:hover::after {
                opacity: 1;
            }

            .asset-library-item .asset-preview {
                border-bottom: 1px solid rgba(0, 240, 255, 0.12);
            }

            .asset-library-item .asset-info {
                display: flex;
                align-items: center;
                gap: 8px;
                flex-wrap: wrap;
            }

            .asset-library-item .asset-info h4 {
                width: 100%;
                margin: 0 0 6px 0;
                color: #eaf6ff;
                font-size: 1.05rem;
                letter-spacing: 0.02em;
            }

            .asset-library-item .asset-type {
                padding: 4px 10px;
                border-radius: 999px;
                background: rgba(0, 240, 255, 0.14);
                border: 1px solid rgba(0, 240, 255, 0.32);
                color: #00f0ff;
                font-size: 12px;
                font-weight: 600;
                line-height: 1;
                margin: 0;
            }

            .add-from-library-btn {
                padding: 7px 14px;
                border-radius: 8px;
                border: 1px solid rgba(0, 240, 255, 0.52);
                background: linear-gradient(135deg, rgba(0, 240, 255, 0.95) 0%, rgba(0, 170, 220, 0.92) 100%);
                color: #04111f;
                font-family: 'Rajdhani', 'Segoe UI', sans-serif;
                font-size: 14px;
                font-weight: 700;
                letter-spacing: 0.06em;
                cursor: pointer;
                transition:
                    transform 0.18s ease,
                    filter 0.18s ease,
                    box-shadow 0.2s ease;
            }

            .add-from-library-btn:hover {
                filter: brightness(1.06);
                transform: translateY(-1px);
                box-shadow: 0 0 18px rgba(0, 240, 255, 0.28);
            }

            .add-from-library-btn:active {
                transform: translateY(0);
                filter: brightness(0.98);
            }

            .back-btn {
                display: inline-flex;
                align-items: center;
                gap: 5px;
                margin-bottom: 20px;
            }

            .file-input-wrapper {
                position: relative;
                overflow: hidden;
                display: inline-block;
            }

            .file-input-wrapper input[type='file'] {
                position: absolute;
                top: 0;
                right: 0;
                min-width: 100%;
                min-height: 100%;
                font-size: 100px;
                text-align: right;
                filter: alpha(opacity=0);
                opacity: 0;
                outline: none;
                cursor: pointer;
                display: block;
            }

            .empty-assets {
                text-align: center;
                padding: 60px 20px;
                color: #9aa8c4;
                border: 1px dashed rgba(0, 240, 255, 0.22);
                border-radius: 12px;
                background: rgba(0, 240, 255, 0.03);
            }

            .empty-assets i {
                font-size: 60px;
                margin-bottom: 15px;
                display: block;
            }

            /* 下拉框：与 AI 生成页同款结构与视觉 */
            select.tech-select-native {
                position: absolute !important;
                width: 1px !important;
                height: 1px !important;
                padding: 0 !important;
                margin: 0 !important;
                border: 0 !important;
                opacity: 0 !important;
                pointer-events: none !important;
            }

            .tech-select {
                position: relative;
                width: 100%;
                z-index: 20;
            }

            .tech-select.is-open {
                z-index: 1400;
            }

            .tech-select-trigger {
                width: 100%;
                min-height: 42px;
                padding: 10px 40px 10px 14px;
                border-radius: 6px;
                border: 1px solid rgba(0, 240, 255, 0.72);
                background:
                    linear-gradient(to right, rgba(0, 240, 255, 0.3), rgba(0, 240, 255, 0.08)) calc(100% - 38px) 50% /
                        1px 62% no-repeat,
                    #0b1220;
                color: #e8f8ff;
                font-family: 'Rajdhani', 'Segoe UI', sans-serif;
                font-size: 16px;
                text-align: left;
                cursor: pointer;
                transition:
                    border-color 0.2s ease,
                    box-shadow 0.2s ease;
                box-shadow:
                    inset 0 0 0 1px rgba(0, 240, 255, 0.1),
                    0 0 0 1px rgba(3, 8, 18, 0.75);
                position: relative;
                mix-blend-mode: normal;
                isolation: isolate;
            }

            .tech-select-trigger::before,
            .tech-select-trigger::after {
                content: '';
                position: absolute;
                right: 14px;
                width: 6px;
                height: 6px;
                border-right: 2px solid rgba(0, 240, 255, 0.92);
                border-bottom: 2px solid rgba(0, 240, 255, 0.92);
                transform: rotate(45deg);
                transition: transform 0.2s ease;
                pointer-events: none;
            }

            .tech-select-trigger::before {
                top: calc(50% - 6px);
            }
            .tech-select-trigger::after {
                top: calc(50% - 1px);
            }

            .tech-select:hover .tech-select-trigger {
                border-color: rgba(0, 240, 255, 0.82);
                box-shadow:
                    inset 0 0 0 1px rgba(0, 240, 255, 0.18),
                    0 0 0 1px rgba(0, 240, 255, 0.16),
                    0 0 20px rgba(0, 240, 255, 0.14);
            }

            .tech-select.is-open .tech-select-trigger,
            .tech-select-trigger:focus-visible {
                outline: none;
                border-color: rgba(0, 240, 255, 0.92);
                box-shadow:
                    inset 0 0 0 1px rgba(0, 240, 255, 0.24),
                    0 0 0 2px rgba(0, 240, 255, 0.22),
                    0 0 24px rgba(0, 240, 255, 0.2);
            }

            .tech-select.is-open .tech-select-trigger::before {
                transform: rotate(225deg) translate(1px, 1px);
            }

            .tech-select.is-open .tech-select-trigger::after {
                transform: rotate(225deg) translate(-1px, -1px);
            }

            .tech-select-value.is-placeholder {
                color: #9cb3c9;
            }

            .tech-select-menu {
                position: absolute;
                top: calc(100% + 6px);
                left: 0;
                right: 0;
                background: #0b1220;
                border: 1px solid rgba(0, 240, 255, 0.42);
                border-radius: 8px;
                box-shadow:
                    0 12px 28px rgba(0, 0, 0, 0.42),
                    0 0 24px rgba(0, 240, 255, 0.16);
                max-height: 280px;
                overflow-y: auto;
                z-index: 1200;
                padding: 6px;
                display: none;
                mix-blend-mode: normal;
                isolation: isolate;
                scrollbar-width: thin;
                scrollbar-color: rgba(0, 240, 255, 0.75) rgba(10, 18, 34, 0.95);
            }

            .tech-select-menu::-webkit-scrollbar {
                width: 10px;
            }
            .tech-select-menu::-webkit-scrollbar-track {
                background: rgba(10, 18, 34, 0.95);
                border-left: 1px solid rgba(0, 240, 255, 0.18);
                border-radius: 10px;
            }
            .tech-select-menu::-webkit-scrollbar-thumb {
                background: linear-gradient(180deg, rgba(0, 240, 255, 0.88), rgba(139, 92, 246, 0.78));
                border-radius: 10px;
                border: 2px solid rgba(10, 18, 34, 0.95);
                box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1);
            }
            .tech-select-menu::-webkit-scrollbar-thumb:hover {
                background: linear-gradient(180deg, rgba(0, 240, 255, 0.98), rgba(139, 92, 246, 0.9));
            }

            .tech-select.is-open .tech-select-menu {
                display: block;
            }

            .tech-select-menu.tech-select-menu--portal {
                position: fixed;
                left: 0;
                top: 0;
                right: auto;
                z-index: 5000;
                display: block;
            }

            .tech-select-option {
                width: 100%;
                border: 0;
                border-radius: 6px;
                padding: 10px 12px;
                background: #0f1a2d;
                color: #d9ecfb;
                text-align: left;
                font-family: 'Rajdhani', 'Segoe UI', sans-serif;
                font-size: 15px;
                cursor: pointer;
                transition:
                    background 0.15s ease,
                    color 0.15s ease;
            }

            .tech-select-option:hover {
                background: #16314a;
                color: #f4feff;
            }

            .tech-select-option.is-selected {
                background: #193a57;
                color: #00f0ff;
            }

            .tech-select-option.is-placeholder {
                color: #9cb3c9;
            }
            .tech-select-option:disabled {
                opacity: 0.55;
                cursor: not-allowed;
            }

            .form-row {
                display: flex;
                gap: 16px;
                align-items: center;
            }
            .form-row > * {
                flex: 1;
            }
            .radio-group {
                display: flex;
                gap: 16px;
                flex-wrap: wrap;
            }
            .file-name {
                color: var(--shell-muted, #b0b0c0);
                font-size: 13px;
                margin-top: 4px;
            }

            input[type='radio'] {
                appearance: none;
                -webkit-appearance: none;
                width: 18px;
                height: 18px;
                border: 2px solid rgba(0, 240, 255, 0.4);
                border-radius: 50%;
                background: transparent;
                cursor: pointer;
                transition: all 0.2s ease;
                position: relative;
            }
            input[type='radio']:checked {
                border-color: #00f0ff;
                background: rgba(0, 240, 255, 0.15);
            }
            input[type='radio']:checked::after {
                content: '';
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                width: 8px;
                height: 8px;
                background: #00f0ff;
                border-radius: 50%;
            }
            input[type='radio']:focus-visible {
                box-shadow: 0 0 0 2px rgba(0, 240, 255, 0.4);
            }

            @media (prefers-reduced-motion: reduce) {
                .project-header::before,
                .asset-upload-section::before {
                    animation: none !important;
                }
                .project-header::after,
                .asset-upload-section::after,
                .asset-card::before,
                .asset-library-item::after {
                    transition: none !important;
                    opacity: 0.45 !important;
                }
                .asset-card,
                .asset-library-item,
                .add-from-library-btn {
                    transition: none !important;
                    transform: none !important;
                }
            }

            /* 素材列表搜索栏 */
            .asset-list-search {
                position: relative;
                margin-bottom: 16px;
            }
            .asset-list-search input {
                width: 100%;
                padding: 10px 15px 10px 38px;
                background: rgba(5, 8, 16, 0.65);
                border: 1px solid rgba(0, 240, 255, 0.18);
                border-radius: 6px;
                color: #f0f4fc;
                font-size: 15px;
                font-family: 'Rajdhani', 'Segoe UI', sans-serif;
                outline: none;
                transition:
                    border-color 0.2s ease,
                    box-shadow 0.2s ease;
            }
            .asset-list-search input:focus {
                border-color: rgba(0, 240, 255, 0.55);
                box-shadow: 0 0 12px rgba(0, 240, 255, 0.15);
            }
            .asset-list-search input::placeholder {
                color: #6b7a94;
            }
            .asset-list-search i {
                position: absolute;
                left: 12px;
                top: 50%;
                transform: translateY(-50%);
                color: #6b7a94;
                font-size: 14px;
                pointer-events: none;
            }
        </style>

    </head>

                                    <button class="secondary-btn">选择文件</button>
                                    <input type="file" id="local-file-input" accept="image/*" />
                                </div>
                                <p id="selected-file-name" class="file-name">未选择文件</p>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>素材描述</label>
                            <textarea id="local-asset-desc" placeholder="请输入素材描述"></textarea>
                        </div>
                        <button id="upload-asset-btn" class="primary-btn">上传素材</button>
                    </div>

                    <!-- AI生成 -->
                    <div class="upload-content" id="ai-generate">
                        <div class="form-group">
                            <label>生成方式</label>
                            <div class="radio-group">
                                <label><input type="radio" name="ai-method" value="sketch" checked /> 从线稿生成</label>
                                <label><input type="radio" name="ai-method" value="description" /> 从描述生成</label>
                            </div>
                        </div>

                        <!-- 从线稿生成 -->
                        <div id="sketch-generate" class="ai-method-content">
                            <div class="form-group">
                                <label>线稿图片URL</label>
                                <input type="text" id="sketch-url" placeholder="请输入线稿图片URL" />
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>目标风格</label>
                                    <select id="sketch-style">
                                        <option value="卡通">卡通风格</option>
                                        <option value="写实">写实风格</option>
                                        <option value="像素">像素风格</option>
                                        <option value="手绘">手绘风格</option>
                                        <option value="赛博朋克">赛博朋克风格</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>输出类型</label>
                                    <select id="sketch-output-type">
                                        <option value="character">角色</option>
                                        <option value="environment">场景</option>
                                        <option value="prop">道具</option>
                                        <option value="image">图片</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- 从描述生成 -->
                        <div id="description-generate" class="ai-method-content hidden">
                            <div class="form-group">
                                <label>素材描述</label>
                                <textarea id="asset-description" placeholder="请详细描述您想要生成的素材"></textarea>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>目标风格</label>
                                    <select id="desc-style">
                                        <option value="卡通">卡通风格</option>
                                        <option value="写实">写实风格</option>
                                        <option value="像素">像素风格</option>
                                        <option value="手绘">手绘风格</option>
                                        <option value="赛博朋克">赛博朋克风格</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>输出类型</label>
                                    <select id="desc-output-type">
                                        <option value="character">角色</option>
                                        <option value="environment">场景</option>
                                        <option value="prop">道具</option>
                                        <option value="image">图片</option>
                                        <option value="icon">图标</option>
                                        <option value="button">按钮</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <button id="generate-asset-btn" class="primary-btn">AI生成素材</button>
                    </div>

                    <!-- 素材库 -->
                    <div class="upload-content" id="asset-library">
                        <div class="form-group">
                            <label>搜索素材</label>
                            <input type="text" id="library-search" placeholder="请输入素材关键词" />
                        </div>
                        <div class="form-group">
                            <label>素材分类</label>
                            <select id="library-category">
                                <option value="all">全部素材</option>
                                <option value="character">角色</option>
                                <option value="environment">场景</option>
                                <option value="prop">道具</option>
                                <option value="icon">图标</option>
                                <option value="button">按钮</option>
                            </select>
                        </div>

                        <!-- 素材库预览 -->
                        <div class="asset-library-grid">
                            <div class="asset-library-item" data-id="lib1">
                                <div
                                    class="asset-preview"
                                    style="
                                        background: linear-gradient(
                                            135deg,
                                            rgba(0, 240, 255, 0.1),
                                            rgba(139, 92, 246, 0.1)
                                        );
                                        display: flex;
                                        align-items: center;
                                        justify-content: center;
                                        height: 120px;
                                        color: #8b5cf6;
                                        font-size: 14px;
                                    "
                                >
                                    <i class="fas fa-user" style="font-size: 24px; margin-right: 8px"></i> 角色素材
                                </div>
                                <div class="asset-info">
                                    <h4>卡通角色</h4>
                                    <span class="asset-type">角色</span>
                                    <button class="add-from-library-btn" data-id="lib1">添加</button>
                                </div>
                            </div>
                            <div class="asset-library-item" data-id="lib2">
                                <div
                                    class="asset-preview"
                                    style="
                                        background: linear-gradient(
                                            135deg,
                                            rgba(0, 240, 255, 0.1),
                                            rgba(139, 92, 246, 0.1)
                                        );
                                        display: flex;
                                        align-items: center;
                                        justify-content: center;
                                        height: 120px;
                                        color: #00f0ff;
                                        font-size: 14px;
                                    "
                                >
                                    <i class="fas fa-mountain" style="font-size: 24px; margin-right: 8px"></i> 场景素材
                                </div>
                                <div class="asset-info">
                                    <h4>森林场景</h4>
                                    <span class="asset-type">场景</span>
                                    <button class="add-from-library-btn" data-id="lib2">添加</button>
                                </div>
                            </div>
                            <div class="asset-library-item" data-id="lib3">
                                <div
                                    class="asset-preview"
                                    style="
                                        background: linear-gradient(
                                            135deg,
                                            rgba(0, 240, 255, 0.1),
                                            rgba(139, 92, 246, 0.1)
                                        );
                                        display: flex;
                                        align-items: center;
                                        justify-content: center;
                                        height: 120px;
                                        color: #f59e0b;
                                        font-size: 14px;
                                    "
                                >
                                    <i class="fas fa-cube" style="font-size: 24px; margin-right: 8px"></i> 道具素材
                                </div>
                                <div class="asset-info">
                                    <h4>魔法书</h4>
                                    <span class="asset-type">道具</span>
                                    <button class="add-from-library-btn" data-id="lib3">添加</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 素材列表 -->
                <div class="asset-list-section">
                    <h3>项目素材</h3>
                    <div class="asset-list-search">
                        <i class="fas fa-search" aria-hidden="true"></i>
                        <input type="text" id="assetSearchInput" placeholder="搜索素材名称..." aria-label="搜索素材" />
                    </div>
                    <div id="empty-assets" class="empty-assets hidden">
                        <i class="fas fa-image"></i>
                        <p>暂无素材，点击上方"添加素材"按钮开始添加</p>
                    </div>
                    <div id="asset-grid" class="asset-grid"></div>
                </div>
            </div>

            <!-- 版本历史弹窗（默认隐藏） -->
            <div id="version-history-modal" class="modal hidden">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3>版本历史</h3>
                        <button class="close-modal">&times;</button>
                    </div>
                    <div class="modal-body">
                        <div id="version-list" class="version-list"></div>
                    </div>
                    <div class="modal-footer">
                        <button class="secondary-btn close-modal">关闭</button>
                    </div>
                </div>
            </div>

            <!-- 分享项目弹窗（默认隐藏） -->
            <div id="share-modal" class="modal hidden">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3>分享项目</h3>
                        <button class="close-modal">&times;</button>
                    </div>
                    <div class="modal-body">
                        <p>复制以下链接分享项目：</p>
                        <div class="share-link-container">
                            <input type="text" id="share-link" readonly />
                            <button id="copy-link-btn">复制</button>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="secondary-btn close-modal">关闭</button>
                    </div>
                </div>
            </div>

            <!-- 编辑项目弹窗（默认隐藏） -->
            <div id="edit-project-modal" class="modal hidden">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3>编辑项目</h3>
                        <button class="close-modal">&times;</button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="edit-project-id" />
                        <div class="form-group">
                            <label>项目名称*</label>
                            <input type="text" id="edit-project-name" required />
                        </div>
                        <div class="form-group">
                            <label>项目描述</label>
                            <textarea id="edit-project-desc"></textarea>
                        </div>
                        <div class="form-group">
                            <label>项目类型</label>
                            <select id="edit-project-type">
                                <option value="ui">UI设计</option>
                                <option value="game">游戏界面</option>
                                <option value="character">角色设计</option>
                                <option value="environment">场景设计</option>
                                <option value="other">其他</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="secondary-btn close-modal">取消</button>
                        <button id="save-edit-btn" class="primary-btn">保存</button>
                    </div>
                </div>
            </div>

            <!-- 统一风格弹窗（默认隐藏） -->
            <div id="unify-style-modal" class="modal hidden">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3>统一项目风格</h3>
                        <button class="close-modal">&times;</button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="unify-style-project-id" />
                        <div class="form-group">
                            <label>选择目标风格</label>
                            <select id="target-style">
                                <option value="卡通">卡通风格</option>
                                <option value="写实">写实风格</option>
                                <option value="像素">像素风格</option>
                                <option value="手绘">手绘风格</option>
                                <option value="赛博朋克">赛博朋克风格</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="secondary-btn close-modal">取消</button>
                        <button id="confirm-unify-btn" class="primary-btn">确认统一</button>
                    </div>
                </div>
            </div>
        </main>
