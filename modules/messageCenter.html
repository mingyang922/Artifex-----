<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>消息中心 - Artifex</title>
        <link rel="manifest" href="../manifest.json" />
        <meta name="theme-color" content="#00f0ff" />
        <script src="../js/theme-bootstrap.js"></script>
        <link href="../vendor/css/font-awesome.min.css" rel="stylesheet" />
        <link href="../vendor/css/google-fonts.css" rel="stylesheet" />
        <link rel="stylesheet" href="../styles/ui-kit.css" />
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                background: #0a0e18;
                color: #e8ecf4;
                font-family: 'Rajdhani', 'Segoe UI', sans-serif;
                font-weight: 500;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
            }

            .message-center-container {
                background: rgba(15, 22, 41, 0.85);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                border-radius: 16px;
                width: 100%;
                max-width: 800px;
                max-height: 80vh;
                overflow: hidden;
                box-shadow:
                    0 20px 60px rgba(0, 0, 0, 0.5),
                    0 0 30px rgba(0, 240, 255, 0.06);
                border: 1px solid rgba(0, 240, 255, 0.12);
                animation: fadeIn 0.3s ease-out;
            }

            .message-center-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 20px 30px;
                border-bottom: 1px solid rgba(255, 255, 255, 0.08);
                background: rgba(0, 0, 0, 0.15);
            }

            .message-center-header h2 {
                color: white;
                margin: 0;
                font-family: 'Orbitron', sans-serif;
                font-size: 16px;
                font-weight: 600;
                letter-spacing: 2px;
                text-transform: uppercase;
            }

            .close-message-center {
                background: none;
                border: none;
                color: #b0b0c0;
                font-size: 18px;
                cursor: pointer;
                padding: 8px;
                border-radius: 6px;
                transition: all 0.3s ease;
                width: 36px;
                height: 36px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .close-message-center:hover {
                color: #00f0ff;
                background: rgba(0, 240, 255, 0.1);
            }

            .message-center-content {
                padding: 0;
            }

            .message-center-tabs {
                display: flex;
                border-bottom: 1px solid rgba(255, 255, 255, 0.08);
                background: rgba(0, 0, 0, 0.08);
            }

            .message-tab {
                padding: 15px 25px;
                color: #b0b0c0;
                cursor: pointer;
                border-bottom: 2px solid transparent;
                transition: all 0.3s ease;
                font-size: 14px;
                font-weight: 500;
            }

            .message-tab.active {
                color: #00f0ff;
                border-bottom-color: #00f0ff;
                background: rgba(0, 240, 255, 0.05);
            }

            .message-tab:hover {
                color: #00f0ff;
                background: rgba(0, 240, 255, 0.05);
            }

            .message-center-list {
                max-height: 400px;
                overflow-y: auto;
                scrollbar-width: thin;
                scrollbar-color: rgba(0, 240, 255, 0.3) rgba(10, 18, 34, 0.6);
            }

            .message-center-list::-webkit-scrollbar {
                width: 6px;
            }

            .message-center-list::-webkit-scrollbar-track {
                background: rgba(10, 18, 34, 0.6);
            }

            .message-center-list::-webkit-scrollbar-thumb {
                background: rgba(0, 240, 255, 0.3);
                border-radius: 3px;
            }

            .message-center-list::-webkit-scrollbar-thumb:hover {
                background: rgba(0, 240, 255, 0.5);
            }

            .message-item {
                display: flex;
                padding: 20px 30px;
                border-bottom: 1px solid rgba(255, 255, 255, 0.04);
                transition: all 0.3s ease;
                cursor: pointer;
                position: relative;
            }

            .message-item:hover {
                background: rgba(0, 240, 255, 0.04);
            }

            .message-item.unread {
                background: rgba(0, 240, 255, 0.06);
                border-left: 3px solid #00f0ff;
            }

            .message-item.unread::before {
                content: '';
                position: absolute;
                top: 50%;
                right: 20px;
                transform: translateY(-50%);
                width: 8px;
                height: 8px;
                background: #00f0ff;
                border-radius: 50%;
            }

            .message-icon {
                width: 44px;
                height: 44px;
                border-radius: 10px;
                background: rgba(0, 240, 255, 0.08);
                display: flex;
                align-items: center;
                justify-content: center;
                margin-right: 15px;
                flex-shrink: 0;
                transition: all 0.3s ease;
            }

            .message-item:hover .message-icon {
                background: rgba(0, 240, 255, 0.15);
            }

            .message-icon i {
                color: #00f0ff;
                font-size: 18px;
            }

            .message-content {
                flex: 1;
                min-width: 0;
            }

            .message-title {
                color: white;
                font-weight: 600;
                font-size: 15px;
                margin-bottom: 4px;
            }

            .message-text {
                color: #b0b0c0;
                font-size: 13px;
                line-height: 1.4;
                margin-bottom: 4px;
            }

            .message-time {
                color: #666;
                font-size: 12px;
            }

            .message-actions {
                display: flex;
                gap: 6px;
                align-items: center;
                opacity: 0;
                transition: opacity 0.3s ease;
            }

            .message-item:hover .message-actions {
                opacity: 1;
            }

            .message-action-btn {
                background: none;
                border: none;
                color: #b0b0c0;
                cursor: pointer;
                padding: 6px;
                border-radius: 6px;
                transition: all 0.3s ease;
                width: 30px;
                height: 30px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .message-action-btn:hover {
                color: #00f0ff;
                background: rgba(0, 240, 255, 0.1);
            }

            .message-action-btn.delete:hover {
                color: #ff4757;
                background: rgba(255, 71, 87, 0.1);
            }

            .empty-state {
                text-align: center;
                padding: 60px 30px;
                color: #b0b0c0;
                border: 1px dashed rgba(0, 240, 255, 0.15);
                border-radius: 12px;
                margin: 20px;
                background: rgba(0, 240, 255, 0.02);
            }

            .empty-state i {
                font-size: 40px;
                color: rgba(0, 240, 255, 0.3);
                margin-bottom: 16px;
            }

            .empty-state h3 {
                color: #888;
                margin-bottom: 8px;
            }

            .empty-state p {
                color: #666;
                font-size: 13px;
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(12px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            @media (max-width: 768px) {
                .message-center-container {
                    max-width: 100%;
                    margin: 0;
                    border-radius: 0;
                    max-height: 100vh;
                }
                .message-center-header {
                    padding: 15px 20px;
                }
                .message-item {
                    padding: 15px 20px;
                }
                .message-tab {
                    padding: 12px 15px;
                    font-size: 13px;
                }
            }
        </style>
        <link rel="stylesheet" href="../styles/region-themes.css" />
        <link rel="stylesheet" href="../styles/productivity.css" />
    </head>
    <body>
        <div class="message-center-container">
            <div class="message-center-header">
                <h2>消息中心</h2>
                <button class="close-message-center" id="closeMessageCenter" aria-label="关闭">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div class="message-center-content">
                <div class="message-center-tabs">
                    <div class="message-tab active" data-message-tab="all">全部消息</div>
                    <div class="message-tab" data-message-tab="unread">未读消息</div>
                    <div class="message-tab" data-message-tab="system">系统通知</div>
                </div>

                <div class="message-center-list" id="messageList">
                    <div class="message-item unread" data-category="user">
                        <div class="message-icon"><i class="fas fa-user-plus"></i></div>
                        <div class="message-content">
                            <div class="message-title">新用户注册</div>
                            <div class="message-text">用户 "张三" 刚刚注册了账户，请及时审核用户信息</div>
                            <div class="message-time">2025/1/15 14:30</div>
                        </div>
                        <div class="message-actions">
                            <button class="message-action-btn" title="标记为已读" data-action="mark-read">
                                <i class="fas fa-check"></i>
                            </button>
                            <button class="message-action-btn delete" title="删除" data-action="delete">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>

                    <div class="message-item unread" data-category="security">
                        <div class="message-icon"><i class="fas fa-shield-alt"></i></div>
                        <div class="message-content">
                            <div class="message-title">安全提醒</div>
                            <div class="message-text">检测到异常登录活动，请检查账户安全设置</div>
                            <div class="message-time">2025/1/15 13:45</div>
                        </div>
                        <div class="message-actions">
                            <button class="message-action-btn" title="标记为已读" data-action="mark-read">
                                <i class="fas fa-check"></i>
                            </button>
                            <button class="message-action-btn delete" title="删除" data-action="delete">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>

                    <div class="message-item" data-category="system">
                        <div class="message-icon"><i class="fas fa-cog"></i></div>
                        <div class="message-content">
                            <div class="message-title">系统更新</div>
                            <div class="message-text">系统已更新到最新版本，新增多项功能</div>
                            <div class="message-time">2025/1/15 10:20</div>
                        </div>
                        <div class="message-actions">
                            <button class="message-action-btn" title="标记为已读" data-action="mark-read">
                                <i class="fas fa-check"></i>
                            </button>
                            <button class="message-action-btn delete" title="删除" data-action="delete">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>

                    <div class="message-item" data-category="system">
                        <div class="message-icon"><i class="fas fa-bell"></i></div>
                        <div class="message-content">
                            <div class="message-title">功能更新</div>
                            <div class="message-text">新增消息中心功能，提升用户体验</div>
                            <div class="message-time">2025/1/15 09:15</div>
                        </div>
                        <div class="message-actions">
                            <button class="message-action-btn" title="标记为已读" data-action="mark-read">
                                <i class="fas fa-check"></i>
                            </button>
                            <button class="message-action-btn delete" title="删除" data-action="delete">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 备案信息 -->

        <script src="../js/i18n.js"></script>

    </body>
