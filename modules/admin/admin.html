<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Artifex - 管理员面板</title>
        <link rel="stylesheet" href="../../styles/app-shell.css" />
        <link rel="stylesheet" href="../../styles/ui-kit.css" />
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
        <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet" />
        <style>
            :root {
                --admin-bg: #0a0e18;
                --admin-card-bg: rgba(255, 255, 255, 0.04);
                --admin-border: rgba(255, 255, 255, 0.08);
                --admin-accent: #00f0ff;
                --admin-text: #e8ecf4;
                --admin-muted: #b0b0c0;
            }

            body {
                background: var(--admin-bg);
                color: var(--admin-text);
                font-family: var(--font-ui);
                min-height: 100vh;
            }

            body::before {
                content: "";
                position: fixed;
                inset: -20%;
                background:
                    radial-gradient(circle at 20% 20%, rgba(0, 240, 255, 0.15) 0%, transparent 38%),
                    radial-gradient(circle at 80% 30%, rgba(124, 58, 237, 0.18) 0%, transparent 40%),
                    radial-gradient(circle at 50% 85%, rgba(56, 189, 248, 0.12) 0%, transparent 37%);
                filter: blur(28px);
                pointer-events: none;
                z-index: 0;
            }

            .admin-container {
                max-width: 1200px;
                margin: 0 auto;
                padding: 30px 20px;
                position: relative;
                z-index: 1;
                background-image:
                    linear-gradient(rgba(0, 240, 255, 0.04) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
                background-size: 48px 48px;
            }

            .admin-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 30px;
                padding-bottom: 20px;
                border-bottom: 1px solid var(--admin-border);
            }

            .admin-header h1 {
                font-family: var(--font-display);
                font-size: 20px;
                font-weight: 700;
                letter-spacing: 0.06em;
                color: var(--admin-accent);
                margin: 0;
            }

            .admin-header h1 i {
                margin-right: 10px;
                opacity: 0.8;
            }

            .btn {
                padding: 10px 20px;
                border-radius: 8px;
                font-family: var(--font-ui);
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s ease;
                text-decoration: none;
                display: inline-flex;
                align-items: center;
                gap: 8px;
            }

            .btn-secondary {
                background: rgba(255, 255, 255, 0.05);
                border: 1px solid var(--admin-border);
                color: var(--admin-muted);
            }

            .btn-secondary:hover {
                background: rgba(0, 240, 255, 0.1);
                border-color: rgba(0, 240, 255, 0.3);
                color: var(--admin-accent);
            }

            .admin-tabs {
                display: flex;
                gap: 8px;
                margin-bottom: 25px;
                background: rgba(255, 255, 255, 0.03);
                padding: 6px;
                border-radius: 12px;
                border: 1px solid var(--admin-border);
            }

            .admin-tab {
                padding: 12px 24px;
                background: transparent;
                border: none;
                border-radius: 8px;
                cursor: pointer;
                color: var(--admin-muted);
                font-family: var(--font-ui);
                font-size: 14px;
                font-weight: 600;
                transition: all 0.3s ease;
            }

            .admin-tab:hover {
                color: var(--admin-text);
                background: rgba(255, 255, 255, 0.05);
            }

            .admin-tab.active {
                background: rgba(0, 240, 255, 0.15);
                color: var(--admin-accent);
                box-shadow: 0 0 12px rgba(0, 240, 255, 0.1);
            }

            .card {
                background: var(--admin-card-bg);
                border: 1px solid var(--admin-border);
                border-radius: 16px;
                padding: 24px;
                margin-bottom: 20px;
                -webkit-backdrop-filter: blur(10px);
                backdrop-filter: blur(10px);
                transition: all 0.3s ease;
            }

            .card:hover {
                border-color: rgba(0, 240, 255, 0.2);
                box-shadow: 0 0 20px rgba(0, 240, 255, 0.1);
            }

            .card h2 {
                font-family: var(--font-display);
                font-size: 14px;
                font-weight: 700;
                letter-spacing: 0.06em;
                color: var(--admin-accent);
                margin: 0 0 20px 0;
                padding-bottom: 15px;
                border-bottom: 1px solid var(--admin-border);
            }

            .card h2 i {
                margin-right: 10px;
                opacity: 0.7;
            }

            table {
                width: 100%;
                border-collapse: collapse;
            }

            th, td {
                padding: 14px 16px;
                text-align: left;
                border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            }

            th {
                color: var(--admin-muted);
                font-size: 11px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.08em;
            }

            tr:hover {
                background: rgba(0, 240, 255, 0.04);
            }

            .badge {
                padding: 5px 10px;
                border-radius: 6px;
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 0.04em;
            }

            .badge-success {
                background: rgba(82, 196, 26, 0.15);
                color: #52c41a;
                border: 1px solid rgba(82, 196, 26, 0.2);
            }

            .badge-error {
                background: rgba(255, 120, 117, 0.15);
                color: #ff7875;
                border: 1px solid rgba(255, 120, 117, 0.2);
            }

            .badge-info {
                background: rgba(0, 240, 255, 0.15);
                color: var(--admin-accent);
                border: 1px solid rgba(0, 240, 255, 0.2);
            }

            .stat-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
                gap: 20px;
                margin-bottom: 25px;
            }

            .stat-card {
                background: var(--admin-card-bg);
                border: 1px solid var(--admin-border);
                border-radius: 16px;
                padding: 24px;
                transition: all 0.3s ease;
            }

            .stat-card:hover {
                border-color: rgba(0, 240, 255, 0.2);
                transform: translateY(-2px);
                box-shadow: 0 8px 24px rgba(0, 240, 255, 0.16);
            }

            .stat-card .label {
                font-size: 12px;
                font-weight: 600;
                color: var(--admin-muted);
                margin-bottom: 8px;
                text-transform: uppercase;
                letter-spacing: 0.06em;
            }

            .stat-card .value {
                font-family: var(--font-display);
                font-size: 32px;
                font-weight: 700;
                color: var(--admin-accent);
                line-height: 1;
            }

            .empty-state {
                text-align: center;
                padding: 40px;
                color: var(--admin-muted);
                border: 1px dashed rgba(0, 240, 255, 0.22);
                border-radius: 12px;
                background: rgba(0, 240, 255, 0.03);
            }

            .dashboard-container {
                display: flex;
                min-height: 100vh;
                width: 100%;
                position: relative;
                z-index: 2;
            }

            .sidebar {
                width: 240px;
                background: linear-gradient(180deg, #0f1629 0%, #0a0e18 100%);
                padding: 0;
                box-shadow:
                    4px 0 32px rgba(0, 0, 0, 0.45),
                    inset -1px 0 0 rgba(0, 240, 255, 0.12);
                position: fixed;
                height: 100vh;
                top: 0;
                left: 0;
                z-index: 100;
            }

            .sidebar::after {
                content: '';
                position: absolute;
                top: 0;
                right: 0;
                bottom: 0;
                width: 1px;
                background: linear-gradient(
                    180deg,
                    transparent 0%,
                    rgba(0, 240, 255, 0.35) 30%,
                    rgba(167, 139, 250, 0.4) 55%,
                    rgba(0, 240, 255, 0.25) 80%,
                    transparent 100%
                );
                opacity: 0.85;
                pointer-events: none;
            }

            .sidebar-logo {
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
                border-bottom: 1px solid rgba(255, 255, 255, 0.08);
                gap: 10px;
            }

            .sidebar-logo .logo-img {
                height: 40px;
                width: auto;
                object-fit: contain;
            }

            .sidebar-logo h1 {
                font-family: var(--font-display);
                font-size: 13px;
                font-weight: 700;
                letter-spacing: 0.06em;
                color: #f0f4fc;
                margin: 0;
            }

            .nav-menu {
                list-style: none;
                padding: 0;
                margin: 0;
            }

            .nav-item {
                margin-bottom: 0;
            }

            .nav-link {
                display: flex;
                align-items: center;
                padding: 15px 20px;
                color: #b0b0c0;
                text-decoration: none;
                transition: all 0.3s ease;
                border-left: 3px solid transparent;
            }

            .nav-link:hover,
            .nav-link.active {
                background: rgba(0, 240, 255, 0.1);
                color: #00f0ff;
                border-left-color: #00f0ff;
            }

            .nav-link i {
                margin-right: 10px;
                width: 20px;
                text-align: center;
            }

            .main-content {
                flex: 1;
                padding: 20px;
                margin-left: 240px;
                overflow-y: auto;
                overflow-x: hidden;
                min-height: 100vh;
                box-sizing: border-box;
                position: relative;
                background-color: rgba(10, 14, 24, 0.55);
            }

            .pointer-glow {
                position: fixed;
                left: 50vw;
                top: 50vh;
                width: 560px;
                height: 560px;
                margin-left: -280px;
                margin-top: -280px;
                border-radius: 50%;
                background: radial-gradient(
                    circle,
                    rgba(0, 240, 255, 0.22) 0%,
                    rgba(167, 139, 250, 0.12) 40%,
                    transparent 70%
                );
                pointer-events: none;
                z-index: 1;
                mix-blend-mode: screen;
                transition: opacity 0.35s ease;
                opacity: 0;
            }

            .pointer-glow--lag {
                width: 720px;
                height: 720px;
                margin-left: -360px;
                margin-top: -360px;
                background: radial-gradient(
                    circle,
                    rgba(236, 72, 153, 0.12) 0%,
                    rgba(0, 240, 255, 0.09) 46%,
                    transparent 72%
                );
                filter: blur(14px);
                opacity: 0;
                transition:
                    left 0.38s cubic-bezier(0.22, 1, 0.36, 1),
                    top 0.38s cubic-bezier(0.22, 1, 0.36, 1),
                    opacity 0.3s ease;
            }
        </style>
    </head>
    <body class="app-shell">
        <div class="pointer-glow"></div>
        <div class="pointer-glow pointer-glow--lag"></div>
        <div class="dashboard-container">
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-logo">
                    <img src="../../js/logo-main.png" alt="Artifex" class="logo-img" />
                    <h1>Artifex</h1>
                </div>
                <ul class="nav-menu">
                    <li class="nav-item">
                        <a href="../../dashboard.html" class="nav-link">
                            <i class="fas fa-home"></i>
                            <span>主页</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="../project-management/index.html" class="nav-link">
                            <i class="fas fa-project-diagram"></i>
                            <span>项目管理</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="../ai-generate/ai-generator-new.html" class="nav-link">
                            <i class="fas fa-magic"></i>
                            <span>AI 生成</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="../asset-library/asset-library.html" class="nav-link">
                            <i class="fas fa-images"></i>
                            <span>素材库</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="../style-presets/style-presets.html" class="nav-link">
                            <i class="fas fa-swatchbook"></i>
                            <span>风格预设</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="../user-center/userCenter.html" class="nav-link">
                            <i class="fas fa-user-circle"></i>
                            <span>账户</span>
                        </a>
                    </li>
                </ul>
            </aside>

            <main class="main-content">
        <div class="admin-container">
            <div class="admin-header">
                <h1><i class="fas fa-shield-alt"></i> 管理员面板</h1>
                <a href="../../dashboard.html" class="btn btn-secondary">返回主页</a>
            </div>

            <div class="admin-tabs">
                <div class="admin-tab active" data-tab="overview">概览</div>
                <div class="admin-tab" data-tab="users">用户管理</div>
                <div class="admin-tab" data-tab="usage">用量统计</div>
            </div>

            <!-- 概览 -->
            <div id="tab-overview" class="tab-content">
                <div class="stat-grid">
                    <div class="stat-card">
                        <div class="label">总用户数</div>
                        <div class="value" id="stat-total-users">-</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">今日调用</div>
                        <div class="value" id="stat-today-calls">-</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">总调用次数</div>
                        <div class="value" id="stat-total-calls">-</div>
                    </div>
                </div>
            </div>

            <!-- 用户管理 -->
            <div id="tab-users" class="tab-content" style="display:none">
                <div class="card">
                    <h2><i class="fas fa-users"></i> 用户列表</h2>
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>用户名</th>
                                <th>邮箱</th>
                                <th>角色</th>
                                <th>注册时间</th>
                            </tr>
                        </thead>
                        <tbody id="users-table-body"></tbody>
                    </table>
                </div>
            </div>

            <!-- 用量统计 -->
            <div id="tab-usage" class="tab-content" style="display:none">
                <div class="card">
                    <h2><i class="fas fa-chart-bar"></i> 按服务商统计</h2>
                    <table>
                        <thead>
                            <tr>
                                <th>服务商</th>
                                <th>调用次数</th>
                            </tr>
                        </thead>
                        <tbody id="provider-stats-body"></tbody>
                    </table>
                </div>
                <div class="card">
                    <h2><i class="fas fa-list"></i> 详细记录</h2>
                    <table>
                        <thead>
                            <tr>
                                <th>用户</th>
                                <th>服务商</th>
                                <th>操作</th>
                                <th>状态</th>
                                <th>次数</th>
                            </tr>
                        </thead>
                        <tbody id="usage-details-body"></tbody>
                    </table>
                </div>
            </div>
        </div>

        </main>
        </div>

        <script src="../../js/ui-kit.js"></script>
        <script src="admin-init.js"></script>
    </body>
</html>
