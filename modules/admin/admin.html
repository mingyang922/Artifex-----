<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Artifex - 管理员面板</title>
        <link rel="stylesheet" href="../../styles/app-shell.css" />
        <link rel="stylesheet" href="../../styles/ui-kit.css" />
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
        <style>
            :root {
                --admin-bg: #0a0e18;
                --admin-card-bg: rgba(255, 255, 255, 0.04);
                --admin-border: rgba(255, 255, 255, 0.08);
                --admin-accent: #00f0ff;
                --admin-text: #e8ecf4;
                --admin-muted: #b0b0c0;
            }

            body {
                background: var(--admin-bg);
                color: var(--admin-text);
                font-family: var(--font-ui);
                min-height: 100vh;
            }

            body::before {
                content: "";
                position: fixed;
                inset: -20%;
                background:
                    radial-gradient(circle at 20% 20%, rgba(0, 240, 255, 0.15) 0%, transparent 38%),
                    radial-gradient(circle at 80% 30%, rgba(124, 58, 237, 0.18) 0%, transparent 40%),
                    radial-gradient(circle at 50% 85%, rgba(56, 189, 248, 0.12) 0%, transparent 37%);
                filter: blur(28px);
                pointer-events: none;
                z-index: 0;
            }

            .admin-container {
                max-width: 1200px;
                margin: 0 auto;
                padding: 30px 20px;
                position: relative;
                z-index: 1;
            }

            .admin-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 30px;
                padding-bottom: 20px;
                border-bottom: 1px solid var(--admin-border);
            }

            .admin-header h1 {
                font-family: var(--font-display);
                font-size: 20px;
                font-weight: 700;
                letter-spacing: 0.06em;
                color: var(--admin-accent);
                margin: 0;
            }

            .admin-header h1 i {
                margin-right: 10px;
                opacity: 0.8;
            }

            .btn {
                padding: 10px 20px;
                border-radius: 8px;
                font-family: var(--font-ui);
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s ease;
                text-decoration: none;
                display: inline-flex;
                align-items: center;
                gap: 8px;
            }

            .btn-secondary {
                background: rgba(255, 255, 255, 0.05);
                border: 1px solid var(--admin-border);
                color: var(--admin-muted);
            }

            .btn-secondary:hover {
                background: rgba(0, 240, 255, 0.1);
                border-color: rgba(0, 240, 255, 0.3);
                color: var(--admin-accent);
            }

            .admin-tabs {
                display: flex;
                gap: 8px;
                margin-bottom: 25px;
                background: rgba(255, 255, 255, 0.03);
                padding: 6px;
                border-radius: 12px;
                border: 1px solid var(--admin-border);
            }

            .admin-tab {
                padding: 12px 24px;
                background: transparent;
                border: none;
                border-radius: 8px;
                cursor: pointer;
                color: var(--admin-muted);
                font-family: var(--font-ui);
                font-size: 14px;
                font-weight: 600;
                transition: all 0.3s ease;
            }

            .admin-tab:hover {
                color: var(--admin-text);
                background: rgba(255, 255, 255, 0.05);
            }

            .admin-tab.active {
                background: rgba(0, 240, 255, 0.15);
                color: var(--admin-accent);
                box-shadow: 0 0 12px rgba(0, 240, 255, 0.1);
            }

            .card {
                background: var(--admin-card-bg);
                border: 1px solid var(--admin-border);
                border-radius: 16px;
                padding: 24px;
                margin-bottom: 20px;
                backdrop-filter: blur(10px);
            }

            .card h2 {
                font-family: var(--font-display);
                font-size: 14px;
                font-weight: 700;
                letter-spacing: 0.06em;
                color: var(--admin-accent);
                margin: 0 0 20px 0;
                padding-bottom: 15px;
                border-bottom: 1px solid var(--admin-border);
            }

            .card h2 i {
                margin-right: 10px;
                opacity: 0.7;
            }

            table {
                width: 100%;
                border-collapse: collapse;
            }

            th, td {
                padding: 14px 16px;
                text-align: left;
                border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            }

            th {
                color: var(--admin-muted);
                font-size: 11px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.08em;
            }

            tr:hover {
                background: rgba(255, 255, 255, 0.02);
            }

            .badge {
                padding: 5px 10px;
                border-radius: 6px;
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 0.04em;
            }

            .badge-success {
                background: rgba(82, 196, 26, 0.15);
                color: #52c41a;
                border: 1px solid rgba(82, 196, 26, 0.2);
            }

            .badge-error {
                background: rgba(255, 120, 117, 0.15);
                color: #ff7875;
                border: 1px solid rgba(255, 120, 117, 0.2);
            }

            .badge-info {
                background: rgba(0, 240, 255, 0.15);
                color: var(--admin-accent);
                border: 1px solid rgba(0, 240, 255, 0.2);
            }

            .stat-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
                gap: 20px;
                margin-bottom: 25px;
            }

            .stat-card {
                background: var(--admin-card-bg);
                border: 1px solid var(--admin-border);
                border-radius: 16px;
                padding: 24px;
                transition: all 0.3s ease;
            }

            .stat-card:hover {
                border-color: rgba(0, 240, 255, 0.2);
                transform: translateY(-2px);
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            }

            .stat-card .label {
                font-size: 12px;
                font-weight: 600;
                color: var(--admin-muted);
                margin-bottom: 8px;
                text-transform: uppercase;
                letter-spacing: 0.06em;
            }

            .stat-card .value {
                font-family: var(--font-display);
                font-size: 32px;
                font-weight: 700;
                color: var(--admin-accent);
                line-height: 1;
            }

            .empty-state {
                text-align: center;
                padding: 40px;
                color: var(--admin-muted);
                font-style: italic;
            }
        </style>
    </head>
    <body>
        <div class="admin-container">
            <div class="admin-header">
                <h1><i class="fas fa-shield-alt"></i> 管理员面板</h1>
                <a href="../../dashboard.html" class="btn btn-secondary">返回主页</a>
            </div>

            <div class="admin-tabs">
                <div class="admin-tab active" data-tab="overview">概览</div>
                <div class="admin-tab" data-tab="users">用户管理</div>
                <div class="admin-tab" data-tab="usage">用量统计</div>
            </div>

            <!-- 概览 -->
            <div id="tab-overview" class="tab-content">
                <div class="stat-grid">
                    <div class="stat-card">
                        <div class="label">总用户数</div>
                        <div class="value" id="stat-total-users">-</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">今日调用</div>
                        <div class="value" id="stat-today-calls">-</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">总调用次数</div>
                        <div class="value" id="stat-total-calls">-</div>
                    </div>
                </div>
            </div>

            <!-- 用户管理 -->
            <div id="tab-users" class="tab-content" style="display:none">
                <div class="card">
                    <h2><i class="fas fa-users"></i> 用户列表</h2>
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>用户名</th>
                                <th>邮箱</th>
                                <th>角色</th>
                                <th>注册时间</th>
                            </tr>
                        </thead>
                        <tbody id="users-table-body"></tbody>
                    </table>
                </div>
            </div>

            <!-- 用量统计 -->
            <div id="tab-usage" class="tab-content" style="display:none">
                <div class="card">
                    <h2><i class="fas fa-chart-bar"></i> 按服务商统计</h2>
                    <table>
                        <thead>
                            <tr>
                                <th>服务商</th>
                                <th>调用次数</th>
                            </tr>
                        </thead>
                        <tbody id="provider-stats-body"></tbody>
                    </table>
                </div>
                <div class="card">
                    <h2><i class="fas fa-list"></i> 详细记录</h2>
                    <table>
                        <thead>
                            <tr>
                                <th>用户</th>
                                <th>服务商</th>
                                <th>操作</th>
                                <th>状态</th>
                                <th>次数</th>
                            </tr>
                        </thead>
                        <tbody id="usage-details-body"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <script src="../../js/ui-kit.js"></script>
        <script>
            // Tab 切换
            document.querySelectorAll('.admin-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
                    document.getElementById('tab-' + tab.dataset.tab).style.display = 'block';
                });
            });

            // 加载数据
            async function loadData() {
                try {
                    // 检查权限
                    const meRes = await fetch('/api/me', { credentials: 'include' });
                    if (meRes.status === 401) { window.location.href = '../../login.html'; return; }
                    const me = await meRes.json();

                    // 加载用户列表
                    const usersRes = await fetch('/api/admin/users', { credentials: 'include' });
                    const usersData = await usersRes.json();
                    if (usersData.ok) {
                        document.getElementById('stat-total-users').textContent = usersData.users.length;
                        const tbody = document.getElementById('users-table-body');
                        tbody.innerHTML = usersData.users.map(u => `
                            <tr>
                                <td>${u.id}</td>
                                <td>${u.username}</td>
                                <td>${u.email}</td>
                                <td><span class="badge ${u.role === 'admin' ? 'badge-info' : 'badge-success'}">${u.role}</span></td>
                                <td>${new Date(u.created_at).toLocaleDateString()}</td>
                            </tr>
                        `).join('');
                    }

                    // 加载用量统计
                    const usageRes = await fetch('/api/admin/usage', { credentials: 'include' });
                    const usageData = await usageRes.json();
                    if (usageData.ok) {
                        document.getElementById('stat-today-calls').textContent = usageData.summary.today;
                        document.getElementById('stat-total-calls').textContent = usageData.summary.total;

                        const providerBody = document.getElementById('provider-stats-body');
                        providerBody.innerHTML = usageData.summary.byProvider.map(p => `
                            <tr>
                                <td>${p.provider}</td>
                                <td>${p.count}</td>
                            </tr>
                        `).join('');

                        const detailsBody = document.getElementById('usage-details-body');
                        detailsBody.innerHTML = usageData.details.slice(0, 50).map(d => `
                            <tr>
                                <td>${d.username}</td>
                                <td>${d.provider}</td>
                                <td>${d.operation}</td>
                                <td><span class="badge ${d.status === 'success' ? 'badge-success' : 'badge-error'}">${d.status}</span></td>
                                <td>${d.count}</td>
                            </tr>
                        `).join('');
                    }
                } catch (err) {
                    console.error('加载失败:', err);
                }
            }

            loadData();
        </script>
    </body>
</html>
