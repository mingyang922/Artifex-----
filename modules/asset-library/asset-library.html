<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>素材库</title>
        <link rel="manifest" href="../../manifest.json" />
        <meta name="theme-color" content="#00f0ff" />
        <script vite-ignore src="../../js/theme-bootstrap.js"></script>
        <link href="../../vendor/css/google-fonts.css" rel="stylesheet" />
        <link rel="stylesheet" href="../../styles/app-shell.css" />
        <link rel="stylesheet" href="../../styles/ui-kit.css" />
        <link href="../../vendor/css/font-awesome.min.css" rel="stylesheet" />
        <link rel="stylesheet" href="asset-library-shell.css" />
        <link rel="stylesheet" href="asset-library-features.css" />
        <link rel="stylesheet" href="../../styles/region-themes.css" />
        <link rel="stylesheet" href="../../styles/productivity.css" />
    </head>
    <body class="app-shell" data-app-page="asset-library">
        <div class="pointer-glow" aria-hidden="true"></div>
        <div class="pointer-glow pointer-glow--lag" aria-hidden="true"></div>
        <div class="dashboard-container">
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-logo">
                    <img src="../../js/logo-main.png" alt="Artifex" class="logo-img" />
                    <h1>Artifex</h1>
                </div>
                <ul class="nav-menu">
                    <li class="nav-item">
                        <a href="#" class="nav-link" data-module="home">
                            <i class="fas fa-home"></i>
                            <span data-i18n="nav.home">主页</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link" data-module="project-management">
                            <i class="fas fa-project-diagram"></i>
                            <span data-i18n="nav.projects">项目管理</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link" data-module="ai-generate">
                            <i class="fas fa-magic"></i>
                            <span data-i18n="nav.ai">AI 生成</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link" data-module="asset-library">
                            <i class="fas fa-images"></i>
                            <span data-i18n="nav.assets">素材库</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link" data-module="style-presets">
                            <i class="fas fa-swatchbook"></i>
                            <span data-i18n="nav.presets">风格预设</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link" data-module="user-center">
                            <i class="fas fa-user-circle"></i>
                            <span data-i18n="nav.account">账户</span>
                        </a>
                    </li>
                </ul>
            </aside>

            <main class="main-content">
                <div class="top-bar">
                    <div class="search-bar">
                        <i class="fas fa-search" aria-hidden="true"></i>
                        <input
                            id="search"
                            type="text"
                            placeholder="搜索项目、资产或文档..."
                            data-i18n="dashboard.searchPlaceholder"
                            data-i18n-aria="common.search"
                            aria-label="搜索"
                        />
                    </div>
                    <div class="user-menu">
                        <button class="notification-btn" aria-label="通知">
                            <i class="fas fa-bell"></i>
                            <span class="notification-badge">3</span>
                        </button>
                        <div
                            class="user-avatar user-avatar--placeholder"
                            role="img"
                            aria-label="用户头像"
                            data-i18n-aria="misc.userAvatar"
                        >
                            <i class="fas fa-user" aria-hidden="true"></i>
                        </div>
                    </div>
                </div>

                <div class="asset-wrap scroll-section">
                    <div class="form-header">
                        <h2 data-i18n="assets.pageTitle">素材库</h2>
                        <p data-i18n="assets.pageSubtitle">上传、分类、检索并管理你的素材。</p>
                        <div
                            id="currentProjectHint"
                            style="margin-top: 8px; font-size: 13px; color: #00f0ff; display: none"
                        >
                            <span data-i18n="module.currentProject">当前关联项目：</span><span data-project-name></span>
                            <button
                                type="button"
                                data-back-to-project
                                style="
                                    margin-left: 8px;
                                    padding: 2px 8px;
                                    border-radius: 999px;
                                    border: 1px solid rgba(0, 240, 255, 0.6);
                                    background: transparent;
                                    color: #00f0ff;
                                    cursor: pointer;
                                    font-size: 12px;
                                "
                            >
                                <span data-i18n="module.backToProject">返回项目详情</span>
                            </button>
                        </div>
                    </div>

                    <div class="top-row">
                        <div class="asset-search-bar">
                            <i class="fas fa-search" aria-hidden="true"></i>
                            <input
                                id="assetSearch"
                                type="text"
                                placeholder="搜索素材名称或描述..."
                                aria-label="搜索素材"
                                data-i18n="assets.searchPlaceholder"
                                data-i18n-aria="assets.searchAria"
                            />
                        </div>
                        <div class="filters">
                            <select id="typeFilter" class="input-group">
                                <option value="all" data-i18n="assets.allTypes">全部类型</option>
                                <option value="image" data-i18n="assets.image">图片</option>
                                <option value="icon" data-i18n="assets.icon">图标</option>
                                <option value="button" data-i18n="assets.button">按钮</option>
                                <option value="component" data-i18n="assets.component">组件</option>
                                <option value="character" data-i18n="assets.character">角色</option>
                                <option value="environment" data-i18n="assets.environment">场景</option>
                                <option value="prop" data-i18n="assets.prop">道具</option>
                            </select>
                            <select id="sortOrder" class="input-group">
                                <option value="newest" data-i18n="assets.newest">最新优先</option>
                                <option value="oldest" data-i18n="assets.oldest">最早优先</option>
                                <option value="name" data-i18n="assets.byName">按名称</option>
                            </select>
                            <select id="categoryFilter" class="input-group">
                                <option value="all" data-i18n="assets.allCategories">全部分类</option>
                            </select>
                            <button
                                id="btnAddCategory"
                                class="btn btn-primary btn-small"
                                data-i18n="assets.addCategory"
                            >
                                新增分类
                            </button>
                            <button id="btnClearAll" class="btn btn-small" data-i18n="assets.clearAll">清空所有</button>
                            <button
                                id="btnDetectSimilar"
                                class="btn btn-small"
                                style="
                                    background: rgba(139, 92, 246, 0.15);
                                    border-color: rgba(139, 92, 246, 0.4);
                                    color: #a78bfa;
                                "
                            >
                                <i class="fas fa-clone" style="margin-right: 4px"></i
                                ><span data-i18n="assets.detectSimilar">检测相似素材</span>
                            </button>
                        </div>
                    </div>

                    <!-- 标签筛选栏 -->
                    <div id="tagFilterBar" class="tag-filter-bar" style="display: none">
                        <span class="tag-filter-label"
                            ><i class="fas fa-tags"></i> <span data-i18n="assets.filterByTag">按标签筛选：</span></span
                        >
                        <div id="tagFilterChips"></div>
                    </div>

                    <div class="upload-area" id="uploadArea">
                        <p data-i18n="assets.dropHint">把文件拖到这里或点击下面按钮上传（支持多选）</p>
                        <div style="margin-top: 12px; display: flex; gap: 8px; justify-content: center">
                            <input type="file" id="fileInput" multiple style="display: none" />
                            <button id="btnChoose" class="btn btn-primary" data-i18n="assets.chooseFiles">
                                选择文件
                            </button>
                            <button id="btnUrlImport" class="btn btn-primary">
                                <i class="fas fa-link" style="margin-right: 4px"></i
                                ><span data-i18n="assets.importUrl">从 URL 导入</span>
                            </button>
                            <button id="btnFindSimilar" class="btn btn-primary">
                                <i class="fas fa-copy" style="margin-right: 4px"></i
                                ><span data-i18n="assets.detectSimilar">检测相似素材</span>
                            </button>
                            <select id="uploadCategory" class="input-group" style="width: 160px"></select>
                            <input
                                id="defaultName"
                                class="input-group"
                                placeholder="为上传文件设置默认显示名（可选）"
                                data-i18n="assets.defaultName"
                                style="width: 220px"
                            />
                        </div>
                    </div>

                    <!-- 批量操作栏 -->
                    <div id="batchBar" class="batch-bar" style="display: none">
                        <span id="batchCount" class="batch-count" data-i18n="assets.selectedCount">已选 0 个素材</span>
                        <button id="btnSelectAll" class="btn btn-small">
                            <i class="fas fa-check-double"></i> <span data-i18n="assets.selectAll">全选</span>
                        </button>
                        <button id="btnDeselectAll" class="btn btn-small">
                            <i class="fas fa-times"></i> <span data-i18n="assets.deselectAll">取消选择</span>
                        </button>
                        <button id="btnBatchDelete" class="btn btn-small batch-delete-btn">
                            <i class="fas fa-trash"></i> <span data-i18n="assets.batchDelete">批量删除</span>
                        </button>
                        <div class="export-dropdown-wrap">
                            <button id="btnExportMenu" class="btn btn-primary btn-small">
                                <i class="fas fa-file-export"></i> <span data-i18n="assets.exportFormat">导出格式</span>
                                <i class="fas fa-caret-down" style="margin-left: 4px"></i>
                            </button>
                            <div id="exportMenu" class="export-menu">
                                <button class="export-option" data-format="unity">
                                    <i class="fas fa-gamepad"></i> Unity SpriteSheet
                                </button>
                                <button class="export-option" data-format="godot">
                                    <i class="fas fa-cube"></i> Godot Atlas
                                </button>
                                <button class="export-option" data-format="spritesheet">
                                    <i class="fas fa-th"></i>
                                    <span data-i18n="assets.generalSpriteSheet">通用 SpriteSheet</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div id="assetGrid" class="asset-grid"></div>
                    <div id="noAssets" class="no-assets" style="display: none" data-i18n="assets.empty">
                        暂无素材。试试上传一些文件。
                    </div>
                </div>
            </main>
        </div>

        <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="菜单"><i class="fas fa-bars"></i></button>

        <div id="modalRoot" style="display: none"></div>

        <!-- 备案信息 -->
        <footer class="beian-footer">
            <a href="https://beian.mps.gov.cn/#/query/webSearch?code=11010802048813" rel="noreferrer" target="_blank">
                <img
                    src="../../vendor/images/beian-icon.png"
                    alt="公安备案"
                    class="beian-icon"
                />京公网安备11010802048813号
            </a>
            <span class="beian-separator">|</span>
            <a href="https://beian.miit.gov.cn/" target="_blank" rel="noreferrer">京ICP备2026031602号</a>
        </footer>

        <script vite-ignore defer src="../../js/keyboard-shortcuts.js"></script>
        <script vite-ignore src="../../js/i18n-translations.js"></script>
        <script vite-ignore src="../../js/i18n.js"></script>
        <script vite-ignore src="../../js/region-themes.js"></script>
        <script vite-ignore src="../../js/session-guard.js"></script>
        <script vite-ignore defer src="../../js/ui-kit.js"></script>
        <script vite-ignore defer src="../../js/html-utils.js"></script>
        <script vite-ignore defer src="../../js/navigation.js"></script>
        <script vite-ignore defer src="../../js/notification-component.js"></script>
        <script vite-ignore defer src="../../js/avatar-manager.js"></script>
        <script vite-ignore defer src="../../js/notification-manager.js"></script>
        <script vite-ignore defer src="../../js/scroll-animations.js"></script>
        <script vite-ignore defer src="../../js/user-storage-scope.js"></script>
        <script vite-ignore defer src="../../js/api-utils.js"></script>
        <script vite-ignore defer src="../../js/page-effects.js"></script>
        <script vite-ignore defer src="../../js/lazy-vendors.js"></script>
        <script vite-ignore defer src="asset-library-filter.js"></script>
        <script vite-ignore defer src="asset-library-context-menu.js"></script>
        <script vite-ignore defer src="asset-library-upload.js"></script>
        <script vite-ignore defer src="asset-library-render.js"></script>
        <script vite-ignore defer src="asset-library.js"></script>
        <script vite-ignore defer src="../../js/productivity.js"></script>
        <script vite-ignore defer src="../../js/sw-register.js"></script>
    </body>
</html>
