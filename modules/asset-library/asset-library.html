<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>素材库</title>
        <link rel="manifest" href="../../manifest.json" />
        <meta name="theme-color" content="#00f0ff" />
        <script src="../../js/theme-bootstrap.js"></script>
        <link href="../../vendor/css/google-fonts.css" rel="stylesheet" />
        <link rel="stylesheet" href="../../styles/app-shell.css" />
        <link rel="stylesheet" href="../../styles/ui-kit.css" />
        <link href="../../vendor/css/font-awesome.min.css" rel="stylesheet" />
        <style>
            :root {
                --tech-cyan: #00f0ff;
                --tech-violet: #8b5cf6;
                --font-display: 'Orbitron', 'Segoe UI', sans-serif;
                --font-ui: 'Rajdhani', 'Segoe UI', sans-serif;
                --mx: 50vw;
                --my: 50vh;
            }
            html,
            body {
                height: 100%;
                overflow: hidden;
            }
            /* 与主控制台 / 项目管理统一的科技感皮肤 */
            body {
                background: #0a0e18;
                color: #e8ecf4;
                min-height: 100vh;
                margin: 0;
                font-family: var(--font-ui);
                font-weight: 500;
                font-size: 17px;
            }

            .pointer-glow {
                position: fixed;
                left: var(--mx);
                top: var(--my);
                width: 560px;
                height: 560px;
                margin-left: -280px;
                margin-top: -280px;
                border-radius: 50%;
                background: radial-gradient(
                    circle,
                    rgba(0, 240, 255, 0.22) 0%,
                    rgba(167, 139, 250, 0.12) 40%,
                    transparent 70%
                );
                pointer-events: none;
                z-index: 1;
                mix-blend-mode: screen;
                transition: opacity 0.35s ease;
            }
            .pointer-glow--lag {
                width: 720px;
                height: 720px;
                margin-left: -360px;
                margin-top: -360px;
                background: radial-gradient(
                    circle,
                    rgba(236, 72, 153, 0.12) 0%,
                    rgba(0, 240, 255, 0.09) 46%,
                    transparent 72%
                );
                filter: blur(14px);
                opacity: 0.85;
                transition:
                    left 0.38s cubic-bezier(0.22, 1, 0.36, 1),
                    top 0.38s cubic-bezier(0.22, 1, 0.36, 1),
                    opacity 0.3s ease;
            }
            body:not(.pointer-glow-active) .pointer-glow,
            body:not(.pointer-glow-active) .pointer-glow--lag {
                opacity: 0;
            }

            body::before {
                content: '';
                position: fixed;
                inset: -20%;
                background:
                    radial-gradient(circle at 20% 20%, rgba(0, 240, 255, 0.24) 0%, rgba(0, 240, 255, 0) 38%),
                    radial-gradient(circle at 80% 30%, rgba(124, 58, 237, 0.28) 0%, rgba(124, 58, 237, 0) 40%),
                    radial-gradient(circle at 50% 85%, rgba(56, 189, 248, 0.2) 0%, rgba(56, 189, 248, 0) 37%);
                filter: blur(28px);
                transform: translate3d(0, 0, 0);
                animation: aiFlowBg 7.2s ease-in-out infinite alternate;
                pointer-events: none;
                z-index: 0;
            }

            @keyframes aiFlowBg {
                0% {
                    transform: translate3d(-3%, -2%, 0) scale(1.01);
                }
                50% {
                    transform: translate3d(3%, 2%, 0) scale(1.08);
                }
                100% {
                    transform: translate3d(-2%, 3%, 0) scale(1.04);
                }
            }
            .dashboard-container {
                display: flex;
                min-height: 100vh;
                width: 100%;
                position: relative;
                z-index: 2;
            }
            .sidebar {
                width: 240px;
                background: linear-gradient(180deg, #0f1629 0%, #0a0e18 100%);
                padding: 0;
                box-shadow:
                    4px 0 32px rgba(0, 0, 0, 0.45),
                    inset -1px 0 0 rgba(0, 240, 255, 0.12);
                position: fixed;
                height: 100vh;
                top: 0;
                left: 0;
                z-index: 100;
            }
            .sidebar::after {
                content: '';
                position: absolute;
                top: 0;
                right: 0;
                bottom: 0;
                width: 1px;
                background: linear-gradient(
                    180deg,
                    transparent 0%,
                    rgba(0, 240, 255, 0.35) 30%,
                    rgba(167, 139, 250, 0.4) 55%,
                    rgba(0, 240, 255, 0.25) 80%,
                    transparent 100%
                );
                opacity: 0.85;
                pointer-events: none;
                animation: sidebarEdgeFlow 2.4s ease-in-out infinite;
            }
            @keyframes sidebarEdgeFlow {
                0%,
                100% {
                    opacity: 0.55;
                    filter: blur(0);
                }
                50% {
                    opacity: 1;
                    filter: blur(1px);
                }
            }
            .sidebar-logo {
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
                border-bottom: 1px solid rgba(255, 255, 255, 0.08);
                margin-bottom: 0;
                gap: 10px;
            }
            .sidebar-logo .logo-img {
                height: 40px;
                width: auto;
                object-fit: contain;
            }
            .sidebar-logo h1 {
                font-family: var(--font-display);
                font-size: 13px;
                font-weight: 700;
                letter-spacing: 0.06em;
                color: #f0f4fc;
                margin: 0;
            }
            .nav-menu {
                list-style: none;
                padding: 0;
                margin: 0;
            }
            .nav-item {
                margin-bottom: 0;
            }
            .nav-link {
                display: flex;
                align-items: center;
                padding: 15px 20px;
                color: #b0b0c0;
                text-decoration: none;
                transition: all 0.3s ease;
                border-left: 3px solid transparent;
            }
            .nav-link:hover,
            .nav-link.active {
                background: rgba(0, 240, 255, 0.1);
                color: #00f0ff;
                border-left-color: #00f0ff;
            }
            .nav-link i {
                margin-right: 10px;
                width: 20px;
                text-align: center;
            }

            .main-content {
                flex: 1;
                padding: 20px;
                margin-left: 240px;
                overflow-y: auto;
                overflow-x: hidden;
                height: 100vh;
                min-height: 100vh;
                box-sizing: border-box;
                position: relative;
                background:
                    linear-gradient(rgba(0, 240, 255, 0.04) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
                background-size: 48px 48px;
                background-color: rgba(10, 14, 24, 0.55);
            }
            .main-content::after {
                content: '';
                position: absolute;
                inset: 0;
                pointer-events: none;
                z-index: 0;
                background: repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 2px,
                    rgba(0, 0, 0, 0.07) 2px,
                    rgba(0, 0, 0, 0.07) 4px
                );
                opacity: 0.3;
                mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.55), transparent 75%);
            }
            .main-content > * {
                position: relative;
                z-index: 1;
            }
            .top-bar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 24px;
                padding: 14px 18px;
                border-radius: 10px;
                border: 1px solid rgba(0, 240, 255, 0.15);
                background: rgba(15, 22, 41, 0.65);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                box-shadow: 0 0 28px rgba(0, 240, 255, 0.06);
                position: relative;
                overflow: hidden;
            }
            .top-bar::before {
                content: '';
                position: absolute;
                inset: 0;
                border-radius: 10px;
                background: linear-gradient(
                    105deg,
                    transparent 0%,
                    rgba(0, 240, 255, 0.12) 45%,
                    rgba(167, 139, 250, 0.14) 55%,
                    transparent 100%
                );
                background-size: 200% 100%;
                pointer-events: none;
                animation: topBarShine 1.9s ease-in-out infinite;
                z-index: 0;
            }
            .top-bar > * {
                position: relative;
                z-index: 1;
            }
            .top-bar::after,
            .asset-wrap::after,
            .asset-card::after {
                content: '';
                position: absolute;
                inset: 0;
                border-radius: inherit;
                background: radial-gradient(
                    300px circle at var(--card-x, 50%) var(--card-y, 50%),
                    rgba(0, 240, 255, 0.22),
                    rgba(139, 92, 246, 0.1) 42%,
                    transparent 72%
                );
                opacity: 0;
                transition: opacity 0.16s ease;
                pointer-events: none;
                z-index: 0;
            }
            .top-bar:hover::after,
            .asset-wrap:hover::after,
            .asset-card:hover::after {
                opacity: 1;
            }
            .asset-wrap > *,
            .asset-card > * {
                position: relative;
                z-index: 1;
            }
            @keyframes topBarShine {
                0%,
                100% {
                    background-position: 0% 50%;
                    opacity: 0.58;
                }
                50% {
                    background-position: 100% 50%;
                    opacity: 1;
                }
            }
            .search-bar {
                position: relative;
                width: 300px;
            }
            .search-bar input {
                width: 100%;
                padding: 10px 15px 10px 35px;
                background: rgba(5, 8, 16, 0.65);
                border: 1px solid rgba(0, 240, 255, 0.18);
                border-radius: 6px;
                color: #f0f4fc;
                font-size: 15px;
                font-family: var(--font-ui);
            }
            .search-bar i {
                position: absolute;
                left: 10px;
                top: 50%;
                transform: translateY(-50%);
                color: #b0b0c0;
                font-size: 14px;
            }

            /* asset 页面元素风格调整 - 深色卡片 */
            .asset-wrap {
                width: 100%;
                max-width: none;
                margin: 0;
                box-sizing: border-box;
                padding: 22px 24px 28px;
                border-radius: 10px;
                border: 1px solid rgba(0, 240, 255, 0.18);
                background: rgba(15, 22, 41, 0.55);
                backdrop-filter: blur(14px);
                -webkit-backdrop-filter: blur(14px);
                box-shadow:
                    0 0 0 1px rgba(255, 255, 255, 0.04) inset,
                    0 24px 48px rgba(0, 0, 0, 0.35),
                    0 0 60px rgba(0, 240, 255, 0.05);
                position: relative;
                overflow: hidden;
                --card-x: 50%;
                --card-y: 50%;
            }
            .asset-wrap::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                height: 2px;
                background: linear-gradient(90deg, var(--tech-cyan), var(--tech-violet), transparent);
                opacity: 0.85;
                pointer-events: none;
            }
            .form-header h2 {
                font-family: var(--font-display);
                font-size: 1.05rem;
                font-weight: 700;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                color: var(--tech-cyan);
                text-shadow: 0 0 24px rgba(0, 240, 255, 0.35);
                margin: 0 0 8px 0;
            }
            .form-header p {
                color: #9aa8c4;
                font-size: 15px;
                line-height: 1.5;
                margin: 0;
            }
            .top-row {
                display: flex;
                gap: 12px;
                align-items: center;
                margin-bottom: 16px;
            }
            .search-input.input-group {
                flex: 1;
                padding-left: 40px;
            }
            .asset-wrap select.input-group,
            .asset-wrap .input-group {
                background: rgba(5, 8, 16, 0.65) !important;
                border: 1px solid rgba(0, 240, 255, 0.18) !important;
                border-radius: 6px !important;
                color: #f0f4fc !important;
                font-family: var(--font-ui) !important;
            }
            /* 自定义下拉：与 AI 生成页完全同款 */
            select.input-group.tech-select-native {
                position: absolute !important;
                width: 1px !important;
                height: 1px !important;
                padding: 0 !important;
                margin: 0 !important;
                border: 0 !important;
                opacity: 0 !important;
                pointer-events: none !important;
            }
            .tech-select {
                position: relative;
                width: 100%;
                z-index: 20;
                display: inline-block;
                vertical-align: middle;
            }
            .tech-select.is-open {
                z-index: 1400;
            }
            .tech-select-trigger {
                width: 100%;
                min-height: 48px;
                padding: 12px 40px 12px 14px;
                border-radius: 6px;
                border: 1px solid rgba(var(--tab-accent-rgb, 0, 240, 255), 0.72);
                background:
                    linear-gradient(
                            to right,
                            rgba(var(--tab-accent-rgb, 0, 240, 255), 0.3),
                            rgba(var(--tab-accent-rgb, 0, 240, 255), 0.08)
                        )
                        calc(100% - 38px) 50% / 1px 62% no-repeat,
                    #0b1220;
                color: #e8f8ff;
                font-family: var(--font-ui);
                font-size: 16px;
                text-align: left;
                cursor: pointer;
                transition:
                    border-color 0.2s ease,
                    box-shadow 0.2s ease;
                box-shadow:
                    inset 0 0 0 1px rgba(var(--tab-accent-rgb, 0, 240, 255), 0.1),
                    0 0 0 1px rgba(3, 8, 18, 0.75);
                position: relative;
                mix-blend-mode: normal;
                isolation: isolate;
            }
            .tech-select-trigger::before,
            .tech-select-trigger::after {
                content: '';
                position: absolute;
                right: 14px;
                width: 6px;
                height: 6px;
                border-right: 2px solid rgba(var(--tab-accent-rgb, 0, 240, 255), 0.92);
                border-bottom: 2px solid rgba(var(--tab-accent-rgb, 0, 240, 255), 0.92);
                transform: rotate(45deg);
                transition: transform 0.2s ease;
                pointer-events: none;
            }
            .tech-select-trigger::before {
                top: calc(50% - 6px);
            }
            .tech-select-trigger::after {
                top: calc(50% - 1px);
            }
            .tech-select:hover .tech-select-trigger {
                border-color: rgba(var(--tab-accent-rgb, 0, 240, 255), 0.82);
                box-shadow:
                    inset 0 0 0 1px rgba(var(--tab-accent-rgb, 0, 240, 255), 0.18),
                    0 0 0 1px rgba(var(--tab-accent-rgb, 0, 240, 255), 0.16),
                    0 0 20px rgba(var(--tab-accent-rgb, 0, 240, 255), 0.14);
            }
            .tech-select.is-open .tech-select-trigger,
            .tech-select-trigger:focus-visible {
                outline: none;
                border-color: rgba(var(--tab-accent-rgb, 0, 240, 255), 0.92);
                box-shadow:
                    inset 0 0 0 1px rgba(var(--tab-accent-rgb, 0, 240, 255), 0.24),
                    0 0 0 2px rgba(var(--tab-accent-rgb, 0, 240, 255), 0.22),
                    0 0 24px rgba(var(--tab-accent-rgb, 0, 240, 255), 0.2);
            }
            .tech-select.is-open .tech-select-trigger::before {
                transform: rotate(225deg) translate(1px, 1px);
            }
            .tech-select.is-open .tech-select-trigger::after {
                transform: rotate(225deg) translate(-1px, -1px);
            }
            .tech-select-value.is-placeholder {
                color: #9cb3c9;
            }
            .tech-select-menu {
                position: absolute;
                top: calc(100% + 6px);
                left: 0;
                right: 0;
                background: #0b1220;
                border: 1px solid rgba(var(--tab-accent-rgb, 0, 240, 255), 0.42);
                border-radius: 8px;
                box-shadow:
                    0 12px 28px rgba(0, 0, 0, 0.42),
                    0 0 24px rgba(var(--tab-accent-rgb, 0, 240, 255), 0.16);
                max-height: 280px;
                overflow-y: auto;
                z-index: 1200;
                padding: 6px;
                display: none;
                mix-blend-mode: normal;
                isolation: isolate;
                scrollbar-width: thin;
                scrollbar-color: rgba(var(--tab-accent-rgb, 0, 240, 255), 0.75) rgba(10, 18, 34, 0.95);
            }
            .tech-select-menu::-webkit-scrollbar {
                width: 10px;
            }
            .tech-select-menu::-webkit-scrollbar-track {
                background: rgba(10, 18, 34, 0.95);
                border-left: 1px solid rgba(var(--tab-accent-rgb, 0, 240, 255), 0.18);
                border-radius: 10px;
            }
            .tech-select-menu::-webkit-scrollbar-thumb {
                background: linear-gradient(
                    180deg,
                    rgba(var(--tab-accent-rgb, 0, 240, 255), 0.88),
                    rgba(139, 92, 246, 0.78)
                );
                border-radius: 10px;
                border: 2px solid rgba(10, 18, 34, 0.95);
                box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1);
            }
            .tech-select-menu::-webkit-scrollbar-thumb:hover {
                background: linear-gradient(
                    180deg,
                    rgba(var(--tab-accent-rgb, 0, 240, 255), 0.98),
                    rgba(139, 92, 246, 0.9)
                );
            }
            .tech-select.is-open .tech-select-menu {
                display: block;
            }
            .tech-select-menu.tech-select-menu--portal {
                position: fixed;
                left: 0;
                top: 0;
                right: auto;
                z-index: 5000;
                display: block;
            }
            .tech-select-option {
                width: 100%;
                border: 0;
                border-radius: 6px;
                padding: 10px 12px;
                background: #0f1a2d;
                color: #d9ecfb;
                text-align: left;
                font-family: var(--font-ui);
                font-size: 15px;
                cursor: pointer;
                transition:
                    background 0.15s ease,
                    color 0.15s ease;
            }
            .tech-select-option:hover {
                background: #16314a;
                color: #f4feff;
            }
            .tech-select-option.is-selected {
                background: #193a57;
                color: #00f0ff;
            }
            .tech-select-option.is-placeholder {
                color: #9cb3c9;
            }
            .tech-select-option:disabled {
                opacity: 0.55;
                cursor: not-allowed;
            }
            .filters {
                display: flex;
                gap: 8px;
                align-items: center;
            }
            .upload-area {
                border: 2px dashed rgba(0, 240, 255, 0.22);
                border-radius: 8px;
                padding: 20px;
                text-align: center;
                background: rgba(5, 8, 16, 0.5);
                color: #9aa8c4;
                transition:
                    border-color 0.2s,
                    background 0.2s;
            }
            .upload-area.dragover {
                background: rgba(0, 240, 255, 0.06);
                border-color: #00f0ff;
            }
            .asset-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 14px;
                margin-top: 16px;
            }
            .asset-card {
                background: rgba(8, 12, 24, 0.85);
                border-radius: 8px;
                padding: 10px;
                display: flex;
                flex-direction: column;
                gap: 8px;
                border: 1px solid rgba(0, 240, 255, 0.12);
                position: relative;
                overflow: hidden;
                transition:
                    transform 0.25s ease,
                    border-color 0.25s ease,
                    box-shadow 0.25s ease;
                --card-x: 50%;
                --card-y: 50%;
            }
            .asset-card::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                width: 2px;
                height: 100%;
                background: linear-gradient(180deg, var(--tech-cyan), var(--tech-violet));
                opacity: 0.35;
                pointer-events: none;
                transition: opacity 0.3s ease;
            }
            .asset-card:hover::before {
                opacity: 0.95;
            }
            .asset-card:hover {
                transform: translateY(-5px);
                border-color: rgba(0, 240, 255, 0.35);
                box-shadow:
                    0 14px 32px rgba(0, 0, 0, 0.38),
                    0 0 28px rgba(0, 240, 255, 0.16);
            }
            .thumb {
                width: 100%;
                height: 120px;
                object-fit: cover;
                border-radius: 4px;
                background: #080c14;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 12px;
                color: #9aa8c4;
                border: 1px solid rgba(0, 240, 255, 0.08);
            }
            .meta {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 8px;
                font-size: 13px;
            }
            .meta .name {
                font-weight: 600;
                color: #fff;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .meta .cat {
                font-size: 12px;
                color: #b0b0c0;
            }
            .card-actions {
                display: flex;
                gap: 6px;
            }
            .btn-small {
                padding: 6px 8px;
                font-size: 13px;
                border-radius: 8px;
            }
            .modal {
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.6);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 2000;
            }
            .modal .box {
                background: linear-gradient(165deg, #121a2e 0%, #0c1220 100%);
                color: #e8ecf4;
                padding: 18px;
                border-radius: 8px;
                border: 1px solid rgba(0, 240, 255, 0.2);
                max-width: 90%;
                max-height: 90%;
                overflow: auto;
                box-shadow:
                    0 24px 64px rgba(0, 0, 0, 0.55),
                    0 0 40px rgba(0, 240, 255, 0.08);
            }
            .no-assets {
                color: #9aa8c4;
                padding: 40px;
                text-align: center;
                border: 1px dashed rgba(0, 240, 255, 0.22);
                border-radius: 12px;
                background: rgba(0, 240, 255, 0.03);
            }

            /* 覆盖全局 styles.css 里登录页的 .btn（避免素材库出现棕色大按钮） */
            .asset-wrap .btn {
                width: auto;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                padding: 9px 18px;
                border-radius: 6px;
                font-family: var(--font-display);
                font-size: 10px;
                font-weight: 700;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                transition:
                    transform 0.2s ease,
                    box-shadow 0.2s ease,
                    border-color 0.2s ease;
            }
            .asset-wrap .btn-primary {
                background: linear-gradient(135deg, #00f0ff 0%, #0099cc 100%);
                color: #050810;
                border: 1px solid rgba(0, 240, 255, 0.45);
                box-shadow: 0 0 18px rgba(0, 240, 255, 0.28);
            }
            .asset-wrap .btn-primary:hover {
                transform: translateY(-1px);
                box-shadow: 0 0 26px rgba(0, 240, 255, 0.4);
            }
            .asset-wrap .btn:not(.btn-primary) {
                background: rgba(255, 255, 255, 0.05);
                color: #e8ecf4;
                border: 1px solid rgba(0, 240, 255, 0.18);
            }
            .asset-wrap .btn:not(.btn-primary):hover {
                background: rgba(0, 240, 255, 0.1);
                border-color: rgba(0, 240, 255, 0.35);
                color: #00f0ff;
            }
            .asset-wrap .btn-small {
                padding: 6px 12px;
                font-size: 9px;
            }

            .user-menu {
