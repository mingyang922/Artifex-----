<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Artifex - 主控制台</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;500;600&display=swap"
            rel="stylesheet"
        />
        <!-- 预连接CDN，提高外部资源加载速度 -->
        <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
        <link rel="stylesheet" href="styles/ui-kit.css" />
        <!-- 异步加载非关键CSS -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
            media="print"
            onload="this.media = 'all'"
        />
        <!-- dashboard 样式 -->
        <link rel="stylesheet" href="styles/dashboard.css" />
        <link rel="stylesheet" href="styles/app-shell.css" />
    </head>
    <body class="app-shell" data-app-page="home">
        <div class="pointer-glow" aria-hidden="true"></div>
        <div class="pointer-glow pointer-glow--lag" aria-hidden="true"></div>
        <div class="dashboard-container">
            <!-- 侧边导航 -->
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-logo">
                    <img src="js/logo-main.png" alt="Artifex" class="logo-img" id="logoImg" />
                    <h1>Artifex</h1>
                </div>
                <ul class="nav-menu">
                    <li class="nav-item">
                        <a href="#" class="nav-link" data-module="home">
                            <i class="fas fa-home"></i>
                            <span>主页</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link" data-module="project-management">
                            <i class="fas fa-project-diagram"></i>
                            <span>项目管理</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link" data-module="ai-generate">
                            <i class="fas fa-magic"></i>
                            <span>AI 生成</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link" data-module="asset-library">
                            <i class="fas fa-images"></i>
                            <span>素材库</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link" data-module="style-presets">
                            <i class="fas fa-swatchbook"></i>
                            <span>风格预设</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link" data-module="user-center">
                            <i class="fas fa-user-circle"></i>
                            <span>账户</span>
                        </a>
                    </li>
                </ul>
            </aside>

            <!-- 主内容区 -->
            <main class="main-content">
                <!-- 顶部工具栏 -->
                <div class="top-bar">
                    <div class="search-bar">
                        <i class="fas fa-search" aria-hidden="true"></i>
                        <input type="text" placeholder="搜索项目、资产或文档..." aria-label="搜索" />
                    </div>
                    <div class="user-menu">
                        <button class="notification-btn" aria-label="通知">
                            <i class="fas fa-bell"></i>
                            <span class="notification-badge">3</span>
                        </button>
                        <div class="user-avatar user-avatar--placeholder" role="img" aria-label="用户头像">
                            <i class="fas fa-user" aria-hidden="true"></i>
                        </div>
                    </div>
                </div>

                <!-- 快捷工具 -->
                <section class="quick-tools-section scroll-section">
                    <div class="quick-tools">
                        <div class="tool-card" data-target="project-management">
                            <i class="fas fa-plus-circle"></i>
                            <h3>新建项目</h3>
                            <p>创建全新的UI设计项目</p>
                        </div>
                        <div class="tool-card rotating-border" data-target="ai-generate">
                            <i class="fas fa-magic"></i>
                            <h3>AI生成</h3>
                            <p>使用AI自动生成UI资产</p>
                        </div>
                        <div class="tool-card" data-target="asset-library">
                            <i class="fas fa-images"></i>
                            <h3>素材库</h3>
                            <p>访问游戏UI素材资源</p>
                        </div>
                    </div>
                </section>

                <!-- 最近项目（从本地项目数据动态加载） -->
                <section class="recent-projects scroll-section">
                    <div class="section-header">
                        <h2 class="section-title">最近项目</h2>
                        <a href="#" class="view-all" data-target="project-management">查看全部</a>
                    </div>
                    <div class="projects-grid" id="recent-projects-grid">
                        <!-- 将由脚本根据 localStorage.gameui-projects 动态渲染最近项目 -->
                    </div>
                </section>

                <section
                    class="scroll-section"
                    hidden
                    style="
                        margin-top: 8px;
                        padding: 18px 22px;
                        border-radius: 12px;
                        border: 1px solid rgba(0, 240, 255, 0.18);
                        background: rgba(15, 22, 41, 0.55);
                        max-width: 920px;
                    "
                >
                    <div class="section-header" style="margin-bottom: 10px">
                        <h2 class="section-title"><i class="fas fa-database"></i> 本地数据备份</h2>
                    </div>
                    <p
                        id="artifex-storage-usage"
                        style="color: #b0b8d0; font-size: 14px; margin: 0 0 14px; line-height: 1.5"
                    >
                        正在计算本地存储用量…
                    </p>
                    <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
                        <button
                            type="button"
                            id="artifex-export-local-btn"
                            class="project-action"
                            title="导出为 JSON 文件"
                        >
                            导出 JSON 备份
                        </button>
                        <button
                            type="button"
                            id="artifex-import-local-btn"
                            class="project-action"
                            title="从之前导出的 JSON 恢复"
                        >
                            从文件导入
                        </button>
                        <input
                            type="file"
                            id="artifex-import-local-file"
                            accept="application/json,.json"
                            style="display: none"
                            aria-hidden="true"
                        />
                    </div>
                    <p style="color: #8090a8; font-size: 12px; margin: 12px 0 0">
                        覆盖项目列表、素材库、风格预设与 AI 生成缩略索引等当前登录用户下的键。导入后请刷新页面。
                    </p>
                </section>

                <!-- 模块内容容器 -->
                <div id="module-container"></div>
            </main>
        </div>

        <!-- 移动端菜单按钮 -->
        <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="菜单">
            <i class="fas fa-bars"></i>
        </button>

        <!-- 简化的JavaScript代码 -->
        <script src="js/ui-kit.js"></script>
        <script src="js/api-utils.js"></script>
        <script src="js/user-storage-scope.js"></script>
        <script src="js/data-portability.js"></script>
        <script src="js/navigation.js"></script>
        <script src="js/notification-component.js"></script>
        <script src="js/avatar-manager.js"></script>
        <script src="js/notification-manager.js"></script>
        <script src="js/scroll-animations.js"></script>
        <script src="js/page-effects.js"></script>
        <script src="js/boot-sequence.js"></script>
        <script src="js/holographic-cards.js"></script>
        <script src="js/dashboard-init.js"></script>
    </body>
</html>
