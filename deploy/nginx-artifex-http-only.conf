# Artifex — 仅 HTTP（80），不强制跳转 HTTPS
# 适用：备案完成前，用 IP / 域名走 http 访问
#
# 安装到服务器：
#   sudo cp deploy/nginx-artifex-http-only.conf /etc/nginx/sites-available/artifex
#   sudo ln -sf /etc/nginx/sites-available/artifex /etc/nginx/sites-enabled/artifex
#   sudo rm -f /etc/nginx/sites-enabled/default
#   # 若 certbot 生成过「仅 return 301」的片段，请删除 sites-enabled 里其它冲突文件
#   sudo nginx -t && sudo systemctl reload nginx
#
# 静态目录按实际修改（常见 /var/www/game-management）

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 82.156.244.66 artifex.com.cn www.artifex.com.cn;

    root /var/www/game-management;
    index login.html index.html;

    location / {
        try_files $uri $uri/ /login.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
