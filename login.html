<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Artifex - 登录注册</title>
        <link href="vendor/css/font-awesome.min.css" rel="stylesheet" />
        <link href="vendor/css/google-fonts.css" rel="stylesheet" />
        <link rel="stylesheet" href="styles/app-shell.css" />
        <style>
            /* ═══ 赛博朋克登录页 ═══ */
            :root {
                --login-cyan: #00f0ff;
                --login-violet: #8b5cf6;
                --login-bg: #0a0e18;
                --login-panel: rgba(15, 22, 41, 0.75);
                --login-text: #e8ecf4;
                --login-muted: #b0b0c0;
            }

            body {
                background: var(--login-bg);
                color: var(--login-text);
                min-height: 100vh;
                margin: 0;
                font-family: 'Rajdhani', 'Segoe UI', sans-serif;
                font-weight: 500;
                font-size: 15px;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
            }

            /* ── 动态渐变背景 ── */
            body::before {
                content: '';
                position: fixed;
                inset: -20%;
                background:
                    radial-gradient(ellipse 60% 50% at 20% 30%, rgba(0, 240, 255, 0.12), transparent),
                    radial-gradient(ellipse 50% 60% at 80% 20%, rgba(139, 92, 246, 0.1), transparent),
                    radial-gradient(ellipse 55% 45% at 50% 80%, rgba(56, 189, 248, 0.08), transparent);
                filter: blur(28px);
                animation: loginFlowBg 8s ease-in-out infinite alternate;
                z-index: 0;
            }

            @keyframes loginFlowBg {
                0% { transform: translate(0, 0) scale(1); }
                33% { transform: translate(2%, -1%) scale(1.03); }
                66% { transform: translate(-1%, 2%) scale(0.98); }
                100% { transform: translate(1%, -2%) scale(1.02); }
            }

            /* ── 网格叠加 ── */
            body::after {
                content: '';
                position: fixed;
                inset: 0;
                background-image:
                    linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
                background-size: 48px 48px;
                z-index: 0;
                pointer-events: none;
            }

            .container {
                width: 100%;
                max-width: 420px;
                padding: 20px;
                position: relative;
                z-index: 1;
            }

            /* ── 玻璃拟态表单卡片 ── */
            .form-container {
                background: var(--login-panel);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                border-radius: 16px;
                padding: 40px;
                box-shadow:
                    0 8px 32px rgba(0, 0, 0, 0.4),
                    0 0 40px rgba(0, 240, 255, 0.06),
                    inset 0 1px 0 rgba(255, 255, 255, 0.05);
                border: 1px solid rgba(0, 240, 255, 0.15);
                position: relative;
                overflow: hidden;
            }

            /* 卡片顶部光带 */
            .form-container::before {
                content: '';
                position: absolute;
                top: 0;
                left: -100%;
                width: 200%;
                height: 2px;
                background: linear-gradient(90deg, transparent, var(--login-cyan), var(--login-violet), transparent);
                animation: cardShine 3s ease-in-out infinite;
            }

            @keyframes cardShine {
                0% { left: -100%; }
                100% { left: 100%; }
            }

            .platform-logo {
                display: flex;
                flex-direction: column;
                align-items: center;
                margin-bottom: 30px;
            }

            .platform-logo img {
                display: block;
                width: 120px;
                height: auto;
                margin: 0;
                margin-bottom: -40px;
                filter: drop-shadow(0 0 12px rgba(0, 240, 255, 0.3));
            }

            .platform-logo h1 {
                color: white;
                font-family: 'Orbitron', sans-serif;
                font-size: 26px;
                font-weight: 700;
                margin: 0;
                line-height: 1.1;
                letter-spacing: 4px;
                text-shadow:
                    0 0 10px rgba(0, 240, 255, 0.5),
                    0 0 30px rgba(0, 240, 255, 0.2);
            }

            .form-header {
                text-align: center;
                margin-bottom: 30px;
            }

            .form-header h2 {
                color: white;
                font-family: 'Rajdhani', sans-serif;
                font-size: 20px;
                font-weight: 600;
                margin: 0 0 8px 0;
            }

            .form-header p {
                color: var(--login-muted);
                font-size: 14px;
                margin: 0;
            }

            .input-group {
                position: relative;
                margin-bottom: 20px;
            }

            .input-group i {
                position: absolute;
                left: 15px;
                top: 50%;
                transform: translateY(-50%);
                color: var(--login-muted);
                z-index: 2;
                transition: color 0.3s ease;
            }

            .input-group input {
                width: 100%;
                padding: 12px 15px 12px 45px;
                background: rgba(255, 255, 255, 0.06);
                border: 1px solid rgba(255, 255, 255, 0.12);
                border-radius: 8px;
                color: var(--login-text);
                font-family: 'Rajdhani', sans-serif;
                font-size: 15px;
                transition: all 0.3s ease;
                box-sizing: border-box;
            }

            .input-group input:focus {
                outline: none;
                border-color: var(--login-cyan);
                background: rgba(0, 240, 255, 0.06);
                box-shadow: 0 0 12px 2px rgba(0, 240, 255, 0.1);
            }

            .input-group input:focus + i,
            .input-group input:focus ~ i {
                color: var(--login-cyan);
            }

            .input-group input::placeholder {
                color: var(--login-muted);
            }

            /* 密码输入框容器样式 */
            .password-input-container {
                position: relative;
                display: inline-block;
                width: 100%;
            }

            .password-input-container input {
                padding-right: 45px; /* 为按钮留出足够空间 */
                width: 100%;
                box-sizing: border-box;
            }

            .password-toggle {
                position: absolute;
                right: 12px;
                top: 50%;
                transform: translateY(-50%);
                background: none;
                border: none;
                color: #b0b0c0;
                cursor: pointer;
                padding: 4px;
                border-radius: 4px;
                transition: all 0.3s ease;
                z-index: 10;
                outline: none;
                width: 24px;
                height: 24px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .password-toggle:hover {
                background: rgba(0, 240, 255, 0.1);
                color: var(--login-cyan);
            }

            .password-toggle:focus {
                outline: none;
                background: rgba(0, 240, 255, 0.1);
                color: var(--login-cyan);
                box-shadow: 0 0 0 2px rgba(0, 240, 255, 0.4);
            }

            .password-toggle i {
                font-size: 14px;
                line-height: 1;
            }

            .form-options {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 25px;
            }

            .remember-me {
                display: flex;
                align-items: center;
                color: var(--login-muted);
                font-size: 14px;
                cursor: pointer;
            }

            .remember-me input {
                margin-right: 8px;
                accent-color: var(--login-cyan);
            }

            .forgot-password {
                color: var(--login-cyan);
                text-decoration: none;
                font-size: 14px;
                transition: color 0.3s ease;
            }

            .forgot-password:hover {
                color: #00d4ff;
                text-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
            }

            .btn {
                width: 100%;
                padding: 12px;
                border: none;
                border-radius: 8px;
                font-family: 'Orbitron', sans-serif;
                font-size: 15px;
                font-weight: 600;
                letter-spacing: 2px;
                text-transform: uppercase;
                cursor: pointer;
                transition: all 0.3s ease;
                position: relative;
                overflow: hidden;
            }

            .btn-primary {
                background: linear-gradient(135deg, #00f0ff, #0099cc);
                color: #0a0e18;
            }

            .btn-primary:hover {
                background: linear-gradient(135deg, #00d4ff, #0088bb);
                transform: translateY(-2px);
                box-shadow:
                    0 4px 16px rgba(0, 240, 255, 0.35),
                    0 0 30px rgba(0, 240, 255, 0.15);
            }

            /* 按钮闪光扫过 */
            .btn-primary::before {
                content: '';
                position: absolute;
                top: 0;
                left: -100%;
                width: 60%;
                height: 100%;
                background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
                transition: none;
            }

            .btn-primary:hover::before {
                animation: btnShimmer 0.6s ease;
            }

            @keyframes btnShimmer {
                0% { left: -100%; }
                100% { left: 150%; }
            }

            .btn.loading {
                pointer-events: none;
            }

            .btn.loading::after {
                content: '';
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                width: 20px;
                height: 20px;
                border: 2px solid transparent;
                border-top: 2px solid white;
                border-radius: 50%;
                animation: spin 1s linear infinite;
            }

            @keyframes spin {
                0% {
                    transform: translate(-50%, -50%) rotate(0deg);
                }
                100% {
                    transform: translate(-50%, -50%) rotate(360deg);
                }
            }

            .form-footer {
                text-align: center;
                margin-top: 20px;
            }

            .form-footer p {
                color: var(--login-muted);
                font-size: 14px;
                margin: 0;
            }

            .form-footer a {
                color: var(--login-cyan);
                text-decoration: none;
                transition: all 0.3s ease;
            }

            .form-footer a:hover {
                color: #00d4ff;
                text-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
            }

            .password-strength {
                margin-bottom: 20px;
            }

            .strength-bar {
                width: 100%;
                height: 4px;
                background: rgba(255, 255, 255, 0.1);
                border-radius: 2px;
                overflow: hidden;
                margin-bottom: 8px;
            }

            .strength-fill {
                height: 100%;
                transition: all 0.3s ease;
                border-radius: 2px;
            }

            .strength-fill.weak {
                width: 25%;
                background: #ff4757;
            }

            .strength-fill.medium {
                width: 50%;
                background: #ffa502;
            }

            .strength-fill.strong {
                width: 100%;
                background: #2ed573;
            }

            .strength-text {
                color: var(--login-muted);
                font-size: 12px;
            }

            .terms-agreement {
                display: flex;
                align-items: flex-start;
                color: var(--login-muted);
                font-size: 14px;
                cursor: pointer;
                margin-bottom: 20px;
            }

            .terms-agreement input {
                margin-right: 8px;
                margin-top: 2px;
                accent-color: var(--login-cyan);
            }

            .terms-link {
                color: var(--login-cyan);
                text-decoration: none;
            }

            .terms-link:hover {
                color: #00d4ff;
            }

            .message {
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 12px 20px;
                border-radius: 8px;
                color: white;
                font-weight: 500;
                z-index: 1000;
                transform: translateX(400px);
                transition: transform 0.3s ease;
            }

            .message.show {
                transform: translateX(0);
            }

            .message.success {
                background: linear-gradient(135deg, #2ed573, #1abc9c);
                box-shadow: 0 4px 16px rgba(46, 213, 115, 0.3);
            }

            .message.error {
                background: linear-gradient(135deg, #ff4757, #ff6b81);
                box-shadow: 0 4px 16px rgba(255, 71, 87, 0.3);
            }

            .hidden {
                display: none;
            }

            /* ── 减少动画支持 ── */
            @media (prefers-reduced-motion: reduce) {
                body::before { animation: none !important; }
                .form-container::before { animation: none !important; }
                .btn-primary::before { display: none !important; }
            }

            /* ── 响应式设计 ── */
            @media (max-width: 480px) {
                .container {
                    padding: 10px;
                }

                .form-container {
                    padding: 30px 20px;
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="form-container">
                <!-- 游戏平台Logo -->
                <div class="platform-logo">
                    <img src="js/logo-main.png" alt="Artifex" />
                    <h1>Artifex</h1>
                </div>

                <!-- 登录表单 -->
                <div class="form-wrapper login-form" id="loginForm">
                    <div class="form-header">
                        <h2 data-i18n="login.welcome">欢迎回来，开发者</h2>
                        <p data-i18n="login.subtitle">登录您的账户继续创建游戏UI资产</p>
                    </div>
                    <form id="login">
                        <div class="input-group">
                            <i class="fas fa-user-circle"></i>
                            <input type="email" id="loginEmail" placeholder="邮箱地址" data-i18n="login.email" required aria-label="邮箱地址" />
                        </div>
                        <div class="input-group">
                            <i class="fas fa-lock"></i>
                            <div class="password-input-container">
                                <input type="password" id="loginPassword" placeholder="密码" data-i18n="login.password" required aria-label="密码" />
                                <button type="button" class="password-toggle" id="toggle-login-password" data-i18n-aria="login.showPassword" aria-label="显示密码">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        <div class="form-options">
                            <label class="remember-me">
                                <input type="checkbox" id="rememberMe" />
                                <span class="checkmark"></span>
                                <span data-i18n="login.remember">记住我</span>
                            </label>
                            <a href="#" class="forgot-password" data-i18n="login.forgot">忘记密码？</a>
                        </div>
                        <button type="submit" class="btn btn-primary" data-i18n="login.submit">登录账户</button>
                        <div class="form-footer">
                            <p><span data-i18n="login.noAccount">还没有账户？</span> <a href="#" data-switch-form="registerForm" data-i18n="login.register">立即注册</a></p>
                        </div>
                    </form>
                </div>

                <!-- 注册表单 -->
                <div class="form-wrapper register-form hidden" id="registerForm">
                    <div class="form-header">
                        <h2 data-i18n="login.registerTitle">创建账户</h2>
                        <p data-i18n="login.registerSubtitle">注册成为 Artifex 开发者</p>
                    </div>
                    <form id="register">
                        <div class="input-group">
                            <i class="fas fa-user"></i>
                            <input type="text" id="registerUsername" placeholder="用户名" data-i18n="login.username" required aria-label="用户名" />
                        </div>
                        <div class="input-group">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="registerEmail" placeholder="邮箱地址" data-i18n="login.email" required aria-label="邮箱地址" />
                        </div>
                        <div class="input-group">
                            <i class="fas fa-lock"></i>
                            <div class="password-input-container">
                                <input type="password" id="registerPassword" placeholder="设置密码" data-i18n="login.setPassword" required aria-label="设置密码" />
                                <button type="button" class="password-toggle" id="toggle-register-password" data-i18n-aria="login.showPassword" aria-label="显示密码">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <!-- 密码强度指示器 -->
                        <div class="password-strength">
                            <div class="strength-bar">
                                <div class="strength-fill" id="registerStrengthFill"></div>
                            </div>
                            <div class="strength-text" id="registerStrengthText">密码强度: 未设置</div>
                        </div>

                        <div class="form-options">
                            <label class="terms-agreement">
                                <input type="checkbox" id="agreeTerms" required />
                                <span class="checkmark"></span>
                                <span data-i18n="login.agreeTerms">我同意</span><a href="#" class="terms-link" data-i18n="login.terms">服务条款</a><span>和</span><a href="#" class="terms-link" data-i18n="login.privacy">隐私政策</a>
                            </label>
                        </div>
                        <button type="submit" class="btn btn-primary" data-i18n="login.registerTitle">创建账户</button>
                        <div class="form-footer">
                            <p><span data-i18n="login.hasAccount">已有账户？</span> <a href="#" data-switch-form="loginForm" data-i18n="login.loginNow">立即登录</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- 消息提示 -->
        <div class="message" id="message"></div>

        <script src="js/i18n.js"></script>
        <script src="js/login-init.js"></script>
        <script src="js/api-utils.js"></script>
        <script src="js/login-page.js"></script>
    </body>
</html>
