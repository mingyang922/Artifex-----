version: '3.8'

services:
  artifex:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: artifex-platform
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # 必填：会话密钥（请修改为随机字符串）
      - SESSION_SECRET=${SESSION_SECRET:-change-me-to-random-string}
      # 必填：允许的前端域名（逗号分隔）
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      # AI 服务配置（按需填写）
      - HUNYUAN_SECRET_ID=${HUNYUAN_SECRET_ID:-}
      - HUNYUAN_SECRET_KEY=${HUNYUAN_SECRET_KEY:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - TENCENT_SECRET_ID=${TENCENT_SECRET_ID:-}
      - TENCENT_SECRET_KEY=${TENCENT_SECRET_KEY:-}
      - JIMENG_API_KEY=${JIMENG_API_KEY:-}
    volumes:
      # 持久化 SQLite 数据库
      - artifex-data:/app/backend/data
      # 持久化会话
      - artifex-sessions:/app/backend/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  artifex-data:
  artifex-sessions:
